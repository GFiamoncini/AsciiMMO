<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AsciiMMO</title>
<style>
  html, body { margin: 0; height: 100%; background: #09090f; overflow: hidden; color: #e6e6e6;
    font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #join { position: absolute; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
    background: rgba(9, 9, 15, .82); }
  #join form { display: flex; flex-direction: column; gap: 12px; padding: 24px 28px; background: #000;
    border: 1px solid #cfcfcf; width: min(420px, 86vw); }
  #join h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
  #join p { margin: 0; font-size: 12px; color: #8a8a96; min-height: 14px; }
  input, button { font: inherit; font-size: 15px; padding: 8px 10px; background: #000; color: #e6e6e6;
    border: 1px solid #cfcfcf; outline: none; }
  button { cursor: pointer; }
  button:hover, input:focus { border-color: #ffe066; }
  #classes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #classes button { text-align: left; font-size: 13px; }
  #classes button small { display: block; color: #8a8a96; font-size: 11px; margin-top: 3px; }
  #classes button.on { border-color: #ffe066; color: #ffe066; }
  #chars { display: flex; flex-direction: column; gap: 6px; }
  #chars .row { display: flex; align-items: center; gap: 8px; background: #0e0c12; padding: 4px 8px; font-size: 13px; }
  #chars .row b { color: #e6e6e6; }
  #chars .row span { color: #8a8a96; flex: 1; font-size: 12px; }
  #chars .row button { font-size: 12px; padding: 3px 8px; }
  #chars .load { border-color: #7dff7d; color: #7dff7d; }
  #chars .del { border-color: #d06060; color: #d06060; }
  #say { position: absolute; left: 8px; bottom: 8px; z-index: 2; width: min(560px, 70vw); display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="join">
  <form id="joinForm">
    <h1>AsciiMMO</h1>
    <div id="chars"></div>
    <p style="color:#ffe066">Novo personagem — ou um seu de outro aparelho, com a senha</p>
    <div style="display:flex;gap:8px">
      <input id="name" maxlength="12" placeholder="nome" autocomplete="off" style="flex:1;min-width:0">
      <input id="pw" type="password" maxlength="32" placeholder="senha (opcional)" autocomplete="off" style="flex:1;min-width:0">
    </div>
    <div id="classes">
      <button type="button" data-cls="0">Guerreiro<small>espada · investida</small></button>
      <button type="button" data-cls="1">Mago<small>míssil · bola de fogo</small></button>
      <button type="button" data-cls="2">Cavaleiro<small>lança · bloqueio</small></button>
      <button type="button" data-cls="3">Paladino<small>martelo · cura</small></button>
      <button type="button" data-cls="4">Arqueiro<small>flechas · rajada</small></button>
      <button type="button" data-cls="5">Ladino<small>adagas · passo sombrio</small></button>
      <button type="button" data-cls="6">Necromante<small>seta sombria · dreno</small></button>
    </div>
    <button>Entrar</button>
    <p id="joinMsg">Escolha um personagem ou crie um novo. A senha deixa abrir o mesmo personagem no navegador e no PC.</p>
  </form>
</div>
<input id="say" maxlength="120" placeholder="mensagem (Enter envia, Esc cancela)" autocomplete="off">

<script>
'use strict';
const $ = id => document.getElementById(id);
const glc = $('gl'), hudc = $('hud');
const gl = glc.getContext('webgl', { antialias: false, alpha: false });
const hx = hudc.getContext('2d');
const FONT = 'Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace';
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const TAU = 2 * Math.PI;

// ---------- utilitários de cor e ruído ----------

function hash2(x, y, s) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 2246822519 | 0)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return (h ^ (h >>> 16)) >>> 0;
}

const hex = c => [c >> 16 & 255, c >> 8 & 255, c & 255];
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

// Do mais apagado ao mais cheio: o brilho do "pixel" escolhe o caractere.
const RAMP = '.:;~=+caoqdb0O8Q&$#@';
function rampCode(l) {
  return RAMP.charCodeAt(clamp(l * RAMP.length | 0, 0, RAMP.length - 1));
}

const PLAYER_COLORS = [0xff6b8b, 0xffa94d, 0x8ce99a, 0x66d9e8, 0xb197fc, 0xf783ac, 0xffd43b, 0x74c0fc].map(hex);
const playerColor = c => PLAYER_COLORS[c % PLAYER_COLORS.length];
const WHITE = [255, 255, 255], RED = [255, 60, 50];

// ---------- WebGL: uma textura com a grade de células, outra com os caracteres ----------

const VS = 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }';
const FS = `
precision highp float;
uniform sampler2D uCells, uAtlas;
uniform vec2 uGrid;   // colunas e linhas da grade
uniform vec3 uView;   // deslocamento x, y em pixels e altura da tela
uniform float uCell;  // lado da célula em pixels
void main() {
  vec2 p = vec2(gl_FragCoord.x, uView.z - gl_FragCoord.y) + uView.xy;
  vec2 c = floor(p / uCell);
  vec2 f = (p - c * uCell) / uCell;
  vec4 d = texture2D(uCells, (c + 0.5) / uGrid);
  float code = floor(d.a * 255.0 + 0.5);
  vec2 g = vec2(mod(code, 16.0), floor(code / 16.0));
  float a = texture2D(uAtlas, (g + f) / vec2(16.0, 8.0)).a;
  gl_FragColor = vec4(mix(vec3(0.035, 0.035, 0.06), d.rgb, a), 1.0);
}`;

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function texture(unit) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.NEAREST], [gl.TEXTURE_MAG_FILTER, gl.NEAREST],
    [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  return t;
}

let U = null;
function initGL() {
  if (!gl) throw new Error('este navegador não tem WebGL');
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  texture(0);
  texture(1);
  U = { grid: gl.getUniformLocation(prog, 'uGrid'), view: gl.getUniformLocation(prog, 'uView'),
    cell: gl.getUniformLocation(prog, 'uCell') };
  gl.uniform1i(gl.getUniformLocation(prog, 'uCells'), 0);
  gl.uniform1i(gl.getUniformLocation(prog, 'uAtlas'), 1);
}

// O atlas é redesenhado no tamanho exato da célula a cada passo de zoom,
// para os caracteres saírem nítidos sem filtro.
let atlasCell = 0;
const atlasCanvas = document.createElement('canvas');
function buildAtlas(cs) {
  if (cs === atlasCell) return;
  atlasCell = cs;
  atlasCanvas.width = 16 * cs;
  atlasCanvas.height = 8 * cs;
  const a = atlasCanvas.getContext('2d');
  a.clearRect(0, 0, atlasCanvas.width, atlasCanvas.height);
  a.font = `bold ${Math.max(6, Math.round(cs * 1.2))}px ${FONT}`;
  a.textAlign = 'center';
  a.textBaseline = 'middle';
  a.fillStyle = '#fff';
  for (let code = 33; code < 127; code++) {
    const x = (code & 15) * cs, y = (code >> 4) * cs;
    a.save();
    a.beginPath();
    a.rect(x, y, cs, cs);
    a.clip();
    a.fillText(String.fromCharCode(code), x + cs / 2, y + cs / 2 + cs * 0.06);
    a.restore();
  }
  gl.activeTexture(gl.TEXTURE1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlasCanvas);
}

// ---------- estado vindo do servidor ----------

let map = null;      // {w, h, glyph, color, flags}
let info = null;     // mensagem init
let prev = null, cur = null, tCur = 0;
let ws = null;
const faces = new Map(); // para que lado cada personagem olha
let fxSeen = new Set();

// mapVer é a versão do terreno que este navegador tem; o servidor manda as
// células que mudaram depois dela (árvore derrubada, rocha quebrada...).
let mapVer = 0;
async function loadMap() {
  const res = await fetch('/map');
  const b = new Uint8Array(await res.arrayBuffer());
  const w = b[4] | b[5] << 8, h = b[6] | b[7] << 8, n = w * h;
  map = { w, h, glyph: b.subarray(8, 8 + n), color: b.subarray(8 + n, 8 + 4 * n), flags: b.subarray(8 + 4 * n, 8 + 5 * n) };
  mapVer = +res.headers.get('X-Map-Ver') || 0;
  buildMinimap();
}

// applyEdits grava as células mudadas no mapa e refaz os pontos do minimapa.
function applyEdits(ed) {
  const dirty = new Set();
  for (const [i, ch, c, f] of ed) {
    map.glyph[i] = ch;
    map.color[i * 3] = c >> 16 & 255; map.color[i * 3 + 1] = c >> 8 & 255; map.color[i * 3 + 2] = c & 255;
    map.flags[i] = f;
    dirty.add(((i / map.w | 0) / MM | 0) * mini.width + ((i % map.w) / MM | 0));
  }
  if (!dirty.size) return;
  const c = mini.getContext('2d'), px = c.createImageData(1, 1);
  for (const k of dirty) {
    miniPixel(k % mini.width, k / mini.width | 0, px.data, 0);
    c.putImageData(px, k % mini.width, k / mini.width | 0);
  }
}

// O minimapa é o mapa inteiro reduzido 4 vezes: cada ponto pega a cor mais
// viva do seu bloco de células, para caminhos e construções não sumirem.
const MM = 4;
const mini = document.createElement('canvas');
function miniPixel(mx, my, d, o) {
  let r = 0, g = 0, b = 0, cnt = 0, water = 0, solid = 0;
  for (let dy = 0; dy < MM; dy++) for (let dx = 0; dx < MM; dx++) {
    const i = (my * MM + dy) * map.w + mx * MM + dx;
    if (map.flags[i] & 4) water++;
    if (map.flags[i] & 1) solid++;
    if (map.glyph[i] !== 32) { r += map.color[i * 3]; g += map.color[i * 3 + 1]; b += map.color[i * 3 + 2]; cnt++; }
  }
  const k = cnt ? (0.35 + 0.65 * cnt / (MM * MM)) * 1.25 / cnt : 0;
  if (water > 8) { d[o] = 30; d[o + 1] = 58; d[o + 2] = 120; }
  else if (!cnt && solid > 8) { d[o] = 6; d[o + 1] = 6; d[o + 2] = 10; }
  else { d[o] = Math.min(255, 14 + r * k); d[o + 1] = Math.min(255, 14 + g * k); d[o + 2] = Math.min(255, 22 + b * k); }
  d[o + 3] = 255;
}
function buildMinimap() {
  mini.width = map.w / MM; mini.height = map.h / MM;
  const c = mini.getContext('2d'), img = c.createImageData(mini.width, mini.height);
  for (let my = 0; my < mini.height; my++) for (let mx = 0; mx < mini.width; mx++) miniPixel(mx, my, img.data, (my * mini.width + mx) * 4);
  c.putImageData(img, 0, 0);
}

function connect(name, cls) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?name=${encodeURIComponent(name)}&cls=${cls}&token=${getToken()}&mv=${mapVer}&pw=${encodeURIComponent($('pw').value)}`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.error) { joinError = m.error; return; }
    if (m.init) { info = m; fog = null; $('join').style.display = 'none'; return; }
    if (m.reload) loadMap();
    else if (m.ed && map) applyEdits(m.ed);
    m.steeds = m.steeds || []; m.herbs = m.herbs || [];
    m.pmap = new Map(m.players.map(p => [p.id, p]));
    m.mmap = new Map(m.mobs.map(p => [p.id, p]));
    m.jmap = new Map(m.projs.map(p => [p.id, p]));
    m.smap = new Map(m.steeds.map(p => [p.id, p]));
    for (const p of m.steeds) {
      const o = cur && cur.smap && cur.smap.get(p.id);
      if (o && Math.abs(o.x - p.x) > 0.05) faces.set('s' + p.id, Math.sign(p.x - o.x));
    }
    for (const p of m.players) {
      const o = cur && cur.pmap.get(p.id);
      if (o && o.x !== p.x) faces.set(p.id, Math.sign(p.x - o.x));
    }
    for (const p of m.mobs) {
      const o = cur && cur.mmap.get(p.id);
      if (o && Math.abs(o.x - p.x) > 0.05) faces.set('m' + p.id, Math.sign(p.x - o.x));
    }
    // Cada efeito novo solta suas partículas uma única vez.
    const seen = new Set();
    for (const e of m.fx) {
      const key = `${e.k}:${e.x}:${e.y}:${e.r}`;
      seen.add(key);
      if (!fxSeen.has(key)) fxStart(e);
    }
    fxSeen = seen;
    if (info) takePops(m);
    prev = cur; cur = m; tCur = performance.now();
  };
  ws.onclose = () => {
    ws = null; cur = prev = info = null;
    $('joinMsg').textContent = joinError || 'Conexão perdida. Entre de novo.';
    joinError = '';
    $('join').style.display = 'flex';
    lastChapter = 0; chapterAt = 0; deathAt = 0; floats.length = 0;
    loadChars();
  };
}
const send = m => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
let joinError = '', charName = '';

// O segredo fica só neste navegador e prova ao servidor que o personagem é
// seu. Sem armazenamento local, entra como convidado e nada é salvo.
function getToken() {
  try {
    let t = localStorage.getItem('asciimmo.token');
    if (!t) {
      t = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
      localStorage.setItem('asciimmo.token', t);
    }
    return t;
  } catch (e) { return ''; }
}

// ---------- entrada ----------

const DIRS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
const SLOT_KEYS = { Space: 0, KeyF: 1, KeyR: 2 };
// Painel aberto na coluna da direita ('' = nenhum) e suas linhas clicáveis,
// em pixels CSS, cada uma com a mensagem que o clique manda ao servidor.
let openPanel = '', bigMap = false, uiRects = [], run = false, mapShut = false;
try { mapShut = localStorage.getItem('asciimmo.mapShut') === '1'; } catch (e) { /* sem armazenamento */ }

// Voz: o navegador transcreve o microfone e cada frase conhecida dispara um
// golpe. Vale o nome do golpe ou um apelido curto.
let voice = null, voiceOn = false, voiceMsg = '', voiceAt = 0;
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function voiceCommands() {
  const cmds = info.skills.map((sk, i) => [norm(sk.name), () => use(i, false)]);
  for (const w of ['ataque', 'atacar', 'basico']) cmds.push([w, () => use(0, false)]);
  for (const w of ['especial', 'classe']) cmds.push([w, () => use(1, false)]);
  for (const w of ['supremo', 'final']) cmds.push([w, () => use(2, false)]);
  for (const w of ['pocao', 'curar']) cmds.push([w, () => useItem(0)]);
  return cmds.sort((a, b) => b[0].length - a[0].length); // a frase mais longa ganha
}
function voiceNote(msg) { voiceMsg = msg; voiceAt = performance.now(); }
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return voiceNote('este navegador não reconhece voz');
  if (voiceOn) { voiceOn = false; voice.stop(); return voiceNote('desligada'); }
  voice = new SR();
  voice.lang = 'pt-BR';
  voice.continuous = true;
  voice.interimResults = true; // age na prévia, sem esperar a frase fechar
  let last = '', lastAt = 0;
  voice.onresult = e => {
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const said = norm(e.results[i][0].transcript);
      const hit = voiceCommands().find(([phrase]) => said.includes(phrase));
      if (!hit) continue;
      // A mesma frase volta em várias prévias: dispara uma vez por trecho.
      const key = i + ':' + hit[0], now = performance.now();
      if (key === last && now - lastAt < 1500) continue;
      last = key; lastAt = now;
      hit[1]();
      voiceNote('ouvi "' + hit[0] + '"');
    }
  };
  voice.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { voiceOn = false; voiceNote('microfone bloqueado'); }
  };
  voice.onend = () => { if (voiceOn) try { voice.start(); } catch (err) { /* já reiniciando */ } };
  voiceOn = true;
  try { voice.start(); voiceNote('ligada: diga o nome do golpe'); } catch (err) { voiceOn = false; voiceNote('não consegui abrir o microfone'); }
}
const PANELS = { KeyI: 'sheet', KeyC: 'sheet', KeyK: 'tree', KeyJ: 'ach' };
const useItem = item => send({ t: 'item', item });
const held = new Set();
let lastDir = '0,0';
function sendDir() {
  let dx = 0, dy = 0;
  for (const k of held) { dx += DIRS[k][0]; dy += DIRS[k][1]; }
  dx = Math.sign(dx); dy = Math.sign(dy);
  if (`${dx},${dy},${run}` !== lastDir) { lastDir = `${dx},${dy},${run}`; send({ t: 'in', dx, dy, sp: run }); }
}

// A mira vale enquanto o mouse estiver em uso; parado há um tempo, os
// golpes do teclado saem na direção em que o personagem anda.
let mouseX = 0, mouseY = 0, mouseAt = -1e9;
let meScreen = null; // centro do corpo do jogador na tela, em pixels do dispositivo
function aim(force) {
  if (!meScreen || !force && performance.now() - mouseAt > 2500) return null;
  return Math.atan2(mouseY * dpr - meScreen.y, mouseX * dpr - meScreen.x);
}
function use(slot, force) {
  const m = { t: 'use', s: slot }, a = aim(force);
  if (a !== null) m.dir = a;
  send(m);
}
addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; mouseAt = performance.now(); });
glc.addEventListener('mousedown', e => {
  if (!info) return;
  mouseX = e.clientX; mouseY = e.clientY; mouseAt = performance.now();
  const row = uiRects.find(r => mouseX >= r.x && mouseX < r.x + r.w && mouseY >= r.y && mouseY < r.y + r.h);
  if (row) { row.fn ? row.fn() : send(row.act); e.preventDefault(); return; }
  use(e.button === 2 ? 1 : e.button === 1 ? 2 : 0, true);
  e.preventDefault();
});
addEventListener('contextmenu', e => { if (info) e.preventDefault(); });

const say = $('say');
function closeChat() { say.value = ''; say.style.display = 'none'; say.blur(); }
addEventListener('keydown', e => {
  if (!info || e.target === say) return;
  if (DIRS[e.code]) { held.add(e.code); sendDir(); }
  else if (e.code in SLOT_KEYS) { if (!e.repeat || e.code === 'Space') use(SLOT_KEYS[e.code], false); }
  else if (e.code.startsWith('Shift')) { run = true; sendDir(); }
  else if (PANELS[e.code]) openPanel = openPanel === PANELS[e.code] ? '' : PANELS[e.code];
  else if (e.code === 'KeyM') bigMap = !bigMap;
  else if (e.code === 'KeyV') { if (!e.repeat) toggleVoice(); }
  else if (e.code === 'Escape') { openPanel = ''; bigMap = false; }
  else if (e.code === 'KeyQ') useItem(0);
  else if (e.code === 'KeyE') {
    if (e.repeat) return;
    const me = cur && cur.pmap.get(info.id), s = me ? nearShop(me) : -1;
    if (openPanel === 'shop') openPanel = '';
    else if (s >= 0) { openPanel = 'shop'; shopIdx = s; }
    send({ t: 'act' });
  }
  else if (e.code === 'KeyO') { showFPS = !showFPS; try { localStorage.setItem('asciimmo.fps', showFPS ? '1' : '0'); } catch (err) { /* sem armazenamento */ } }
  else if (e.code === 'KeyX') { if (!e.repeat) send({ t: 'ride' }); }
  else if (/^Digit[1-9]$/.test(e.code)) { const sl = cur && cur.inv[+e.code[5] - 1]; if (sl) useItem(sl[0]); }
  else if (e.code === 'Enter' || e.code === 'KeyT') {
    held.clear(); sendDir();
    say.style.display = 'block'; say.focus();
  } else return;
  e.preventDefault();
});
addEventListener('keyup', e => {
  if (e.code.startsWith('Shift')) run = false;
  else if (!held.delete(e.code)) return;
  sendDir();
});
addEventListener('blur', () => { held.clear(); run = false; sendDir(); });
say.addEventListener('keydown', e => {
  if (e.key === 'Enter') { if (say.value.trim()) send({ t: 'say', text: say.value }); closeChat(); }
  else if (e.key === 'Escape') closeChat();
});

// ---------- zoom e tamanho da tela ----------

let W = 0, H = 0, dpr = 1;
let cs = 0, csTarget = 0, csAt = 0; // lado da célula em pixels do dispositivo
function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (w === W && h === H) return;
  W = w; H = h;
  glc.width = hudc.width = W;
  glc.height = hudc.height = H;
  gl.viewport(0, 0, W, H);
  const fixed = +new URLSearchParams(location.search).get('zoom');
  if (!csTarget && fixed) cs = csTarget = clamp(Math.round(fixed), 3, 28);
  if (!csTarget) {
    // Começa de perto e abre o plano, como a câmera do vídeo de referência.
    csTarget = clamp(Math.round(H / 150), 4, 14);
    cs = Math.min(26, csTarget * 3);
  }
}
addEventListener('wheel', e => { csTarget = clamp(csTarget - Math.sign(e.deltaY), 3, 28); }, { passive: true });

// ---------- composição do quadro ----------

let buf = new Uint8Array(0), cols = 0, rows = 0, x0 = 0, y0 = 0;

function setCell(wx, wy, code, r, g, b) {
  const sx = wx - x0, sy = wy - y0;
  if (sx < 0 || sy < 0 || sx >= cols || sy >= rows) return;
  const o = (sy * cols + sx) * 4;
  buf[o] = r > 255 ? 255 : r; buf[o + 1] = g > 255 ? 255 : g; buf[o + 2] = b > 255 ? 255 : b; buf[o + 3] = code;
}

const slope = a => {
  const s = Math.sin(a), c = Math.cos(a);
  return (Math.abs(c) > 0.92 ? '-' : Math.abs(s) > 0.92 ? '|' : s * c > 0 ? '\\' : '/').charCodeAt(0);
};

// ring desenha um trecho de círculo com o caractere acompanhando a curva.
function ring(cx, cy, r, a0, a1, col) {
  const n = Math.max(12, r * Math.abs(a1 - a0) * 1.5 | 0);
  for (let i = 0; i <= n; i++) {
    const a = a0 + (a1 - a0) * i / n;
    setCell(Math.round(cx + r * Math.cos(a)), Math.round(cy + r * Math.sin(a)), slope(a + Math.PI / 2), col[0], col[1], col[2]);
  }
}

function streak(ax, ay, bx, by, col) {
  const n = Math.max(1, Math.hypot(bx - ax, by - ay) | 0), code = slope(Math.atan2(by - ay, bx - ax));
  for (let i = 0; i <= n; i++) setCell(Math.round(ax + (bx - ax) * i / n), Math.round(ay + (by - ay) * i / n), code, col[0], col[1], col[2]);
}

const parts = [];
function spawn(kind, x, y, vx, vy, life) {
  if (parts.length < 2500) parts.push({ k: PKIND[kind], x, y, vx, vy, life, max: life });
}
function burst(kind, x, y, n, speed, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = speed * (0.25 + 0.75 * Math.random());
    spawn(kind, x, y, Math.cos(a) * v, Math.sin(a) * v, life * (0.5 + 0.5 * Math.random()));
  }
}
function drawParts(dt) {
  let n = 0;
  for (const p of parts) {
    p.life -= dt;
    if (p.life <= 0) continue;
    p.vy += p.k.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    const t = 1 - p.life / p.max, c = p.k.cols, f = t * (c.length - 1), i = Math.min(c.length - 2, f | 0);
    const col = mix3(c[i], c[i + 1], f - i);
    setCell(Math.round(p.x), Math.round(p.y), p.k.chars.charCodeAt(Math.min(p.k.chars.length - 1, t * p.k.chars.length | 0)), col[0], col[1], col[2]);
    parts[n++] = p;
  }
  parts.length = n;
}

// mistAt é a densidade da névoa (0..0.22) numa célula: manchas que andam com o vento.
function mistAt(x, y, T) {
  const fx = x / 46 + T * 0.05, fy = y / 30, ix = Math.floor(fx), iy = Math.floor(fy);
  let tx = fx - ix, ty = fy - iy;
  tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
  const v = (a, b) => (hash2(a, b, 909) & 1023) / 1023;
  const top = v(ix, iy) + (v(ix + 1, iy) - v(ix, iy)) * tx, bot = v(ix, iy + 1) + (v(ix + 1, iy + 1) - v(ix, iy + 1)) * tx;
  return clamp((top + (bot - top) * ty - 0.4) * 0.4, 0, 0.22);
}

// ---------- água, chuva e raios ----------

const ripples = [], rippleAt = new Map();
// drawRipples desenha os anéis achatados que se abrem na água e somem.
function drawRipples(now) {
  let n = 0;
  for (const rp of ripples) {
    const age = (now - rp.t) / 1100;
    if (age >= 1) continue;
    ripples[n++] = rp;
    const r = 1 + age * rp.max, k = 1 - age, steps = Math.max(10, r * 7 | 0);
    for (let s = 0; s < steps; s++) {
      const a = s / steps * TAU, x = Math.round(rp.x + Math.cos(a) * r), y = Math.round(rp.y + Math.sin(a) * r * 0.45);
      if (x < 0 || y < 0 || x >= map.w || y >= map.h || !(map.flags[y * map.w + x] & 4)) continue;
      setCell(x, y, slope(a + Math.PI / 2), 120 * k + 40, 150 * k + 50, 200 * k + 60);
    }
  }
  ripples.length = n;
}

// drawWeather desenha a chuva (ou a neve, nos picos) caindo na diagonal,
// os respingos no chão e os anéis nas poças.
function drawWeather(me, T, now) {
  if (!cur.wx || cur.wx === 3) return; // neblina não chove
  const inRegion = name => info.regions.some(r => r.name === name && Math.hypot(me.x - r.x, me.y - r.y) < r.r);
  if (inRegion('Deserto de Ankar')) return; // no deserto a nuvem passa sem chover
  const snow = inRegion('Picos de Gelo') || cur.season === 3;
  const n = cols * rows * (cur.wx === 2 ? 0.011 : 0.006) | 0;
  for (let i = 0; i < n; i++) {
    const hx = hash2(i, 1, 77), hy = hash2(i, 2, 77), speed = snow ? 7 + (hx & 7) : 60 + (hx & 31);
    const sy = ((hy % rows) + T * speed) % rows, drift = snow ? Math.sin(T + i) * 3 : -T * speed * 0.3;
    const sx = (((hx % cols) + drift) % cols + cols) % cols, wx = x0 + sx, wy = y0 + sy;
    if (snow) { setCell(Math.round(wx), Math.round(wy), hx & 1 ? 42 : 46, 235, 240, 255); continue; }
    const c = cur.wx === 2 ? [150, 170, 210] : [120, 140, 180];
    streak(wx + 1.2, wy - 3, wx, wy, c);
  }
  if (snow) return;
  for (let i = 0; i < n / 5; i++) {
    const x = x0 + Math.random() * cols | 0, y = y0 + Math.random() * rows | 0;
    if (x < 0 || y < 0 || x >= map.w || y >= map.h) continue;
    const f = map.flags[y * map.w + x];
    if (f & 4 && Math.random() < 0.15) ripples.push({ x, y, t: now, max: 3 });
    else if (!(f & 1)) setCell(x, y, Math.random() < 0.7 ? 46 : 111, 170, 190, 225);
  }
}

// drawBolt desenha o raio descendo em zigue-zague do alto da tela até o
// ponto atingido, com galhos; pisca enquanto dura.
function drawBolt(e, T) {
  if (e.p > 0.4) return;
  const step = T * 25 | 0, top = y0 - 2, segs = 12;
  let px = e.x + (hash2(e.x | 0, e.y | 0, 5) % 30) - 15, py = top;
  for (let s = 1; s <= segs; s++) {
    const t = s / segs, nx = s === segs ? e.x : e.x + (px - e.x) * (1 - t) + ((hash2(s, step, e.x | 0) % 9) - 4), ny = top + (e.y - top) * t;
    streak(px, py, nx, ny, [235, 240, 255]);
    if (hash2(s, e.y | 0, 9) % 4 === 0) { // galho
      const bl = 4 + hash2(s, 3, 9) % 6, dir = hash2(s, 4, 9) & 1 ? 1 : -1;
      streak(nx, ny, nx + dir * bl, ny + bl * 0.8, [150, 170, 255]);
    }
    px = nx; py = ny;
  }
  light(e.x, e.y, 70, 2.2 * (1 - e.p), [1.2, 1.2, 1.6], [140, 140, 190]);
}

const SPORE = [0.4, 1.3, 0.5], SPORE_ADD = [20, 70, 20]; // cogumelos das cavernas

const SEASONS = [['Primavera', 'petal', 0.4], ['Verão', '', 0], ['Outono', 'leaf', 0.8], ['Inverno', 'snow', 3]];

const AUTUMN = [[1.35, 0.72, 0.4], [1.25, 0.55, 0.35], [1.3, 0.95, 0.4], [1.05, 0.5, 0.3]];

// daylight vai de 0 (noite fechada) a 1 (dia claro) conforme a hora.
const daylight = tod => clamp(Math.sin((tod - 0.25) * TAU) * 1.4 + 0.35, 0, 1);
// ambient é o multiplicador de cor do céu: azulado à noite, claro de dia e
// alaranjado no nascer e no pôr do sol.
function ambient(sun) {
  // Noites mais fundas e um dia encoberto, puxado para o frio; o crepúsculo fica cor de sangue.
  const a = mix3([0.55, 0.6, 0.86], [1.42, 1.4, 1.3], sun), dusk = Math.exp(-(((sun - 0.3) / 0.22) ** 2));
  return [a[0] + 0.55 * dusk, a[1] - 0.05 * dusk, a[2] - 0.3 * dusk];
}
function light(x, y, r, k, mul, add) { lights.push({ x, y, r2: r * r, r, k, mul: mul || WARM, add: add || WARM_ADD }); }

// fxStart roda uma vez quando um efeito aparece.
function fxStart(e) {
  const cy = e.y - 14;
  if (e.k === 3) burst('fire', e.x, e.y, 90, 60, 0.7);
  else if (e.k === 4) burst('bone', e.x, cy, 40, 34, 0.9);
  else if (e.k === 5) for (let d = 0; d < e.r; d += 1.5) spawn('spark', e.x + Math.cos(e.dir) * d, cy + Math.sin(e.dir) * d, (Math.random() - 0.5) * 16, (Math.random() - 0.5) * 16, 0.3 + Math.random() * 0.3);
  else if (e.k === 6) burst('spark', e.x, cy, 50, 70, 0.4);
  else if (e.k === 7) {
    // dir traz o tipo do projétil: míssil, bola de fogo, flecha ou seta sombria.
    burst(['arcane', 'fire', 'spark', 'shadow'][e.dir] || 'fire', e.x, cy, e.r * 9, e.r * 4.5, 0.75);
    if (e.dir === 1) burst('smoke', e.x, cy, e.r * 3, e.r * 2, 1.3);
  } else if (e.k === 8) for (let i = 0; i < 70; i++) {
    const a = Math.random() * TAU, d = Math.sqrt(Math.random()) * e.r;
    spawn('heal', e.x + Math.cos(a) * d, e.y - Math.random() * 20 + Math.sin(a) * d * 0.6, 0, -6 - Math.random() * 10, 0.5 + Math.random() * 0.7);
  } else if (e.k === 9) burst('holy', e.x, cy, 130, 75, 0.7);
  else if (e.k === 12) burst('shadow', e.x, cy, 130, 75, 0.7);
  else if (e.k === 13) { // raio: clarão na tela toda, tremor e faíscas no chão
    flashUntil = performance.now() + 160;
    shake = 1;
    burst('spark', e.x, e.y, 60, 50, 0.5);
    burst('smoke', e.x, e.y, 20, 12, 1.2);
  }
}

// ---------- corpos articulados ----------
// Os personagens não são sprites fixos: cabeça, tronco, braços, pernas e arma
// são cápsulas posicionadas a cada quadro, então andar e golpear é movimento
// de verdade. Coordenadas locais em células, com (0, 0) nos pés e y para cima
// negativo.

let E = null; // corpo em desenho: origem, corte no chão, clarão
function px(lx, ly, col, l) {
  const wx = E.ox + lx, wy = E.oy + ly;
  if (wy > E.clip || wx < 0 || wy < 0 || wx >= map.w || wy >= map.h || map.flags[wy * map.w + wx] & 2) return;
  E.mask.add(wy * map.w + wx);
  const n = hash2(lx, ly, E.seed);
  l = clamp(l + ((n & 255) / 255 - 0.5) * 0.16, 0.25, 1.3);
  let r = Math.min(255, col[0] * l), g = Math.min(255, col[1] * l), b = Math.min(255, col[2] * l);
  if (E.flash > 0) { r += (E.tint[0] - r) * E.flash; g += (E.tint[1] - g) * E.flash; b += (E.tint[2] - b) * E.flash; }
  setCell(wx, wy, rampCode((0.299 * r + 0.587 * g + 0.114 * b) / 255 * 1.25 + ((n >>> 8 & 15) / 15 - 0.5) * 0.12), r, g, b);
}

// cap preenche uma cápsula (segmento com raio), clareando o lado de cima e
// da esquerda, de onde vem a luz. Em volta fica um contorno vazio, para a
// silhueta se destacar do chão.
function cap(ax, ay, bx, by, r, col) {
  const vx = bx - ax, vy = by - ay, L = vx * vx + vy * vy;
  const minX = Math.floor(Math.min(ax, bx) - r) - 1, maxX = Math.ceil(Math.max(ax, bx) + r) + 1;
  const minY = Math.floor(Math.min(ay, by) - r) - 1, maxY = Math.ceil(Math.max(ay, by) + r) + 1;
  const edge = (r + 1.2) * (r + 1.2);
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      const t = L ? clamp(((x - ax) * vx + (y - ay) * vy) / L, 0, 1) : 0;
      const dx = x - ax - t * vx, dy = y - ay - t * vy;
      const d2 = dx * dx + dy * dy;
      if (d2 > r * r) {
        const wx = E.ox + x, wy = E.oy + y;
        if (d2 <= edge && wy <= E.clip && wx >= 0 && wy >= 0 && wx < map.w && wy < map.h &&
          !(map.flags[wy * map.w + wx] & 2) && !E.mask.has(wy * map.w + wx)) setCell(wx, wy, 32, 0, 0, 0);
        continue;
      }
      px(x, y, col, 0.9 - 0.3 * (dx + dy) / (2 * Math.max(r, 1)));
    }
  }
}

// drawBeast desenha um bicho com as patas em (b.x, b.y): corpo deitado,
// cabeça para o lado em que anda, patas alternando no passo. Aranhas e
// besouros têm as patas arqueadas para fora.
function drawBeast(b) {
  const st = b.style, s = st.scale || 1, f = b.face, T = b.T, act = b.act;
  let lx = 0, ly = 0;
  if (act) { const k = Math.sin(Math.PI * act.t) * 3; lx = Math.cos(act.dir) * k; ly = Math.sin(act.dir) * k; }
  E = { ox: b.x, oy: b.y + (b.sink | 0), clip: b.sink ? b.y : 1e9, flash: b.flash || 0, tint: b.tint || WHITE, seed: st.seed,
    mask: new Set() };
  const C = (ax, ay, bx, by, r, col) => cap(ax * s + lx, ay * s + ly, bx * s + lx, by * s + ly, r * s, col);
  const moving = b.phase !== null, ph = b.phase || 0, L = st.len, pairs = st.fly ? 0 : st.beast / 2;
  const cy = -st.h - st.r + (st.fly ? Math.sin(T * 6 + st.seed) * 1.5 : moving ? Math.abs(Math.sin(ph * 2)) * 0.5 : Math.sin(T * 2.4 + st.seed) * 0.3);
  if (st.fly) {
    // Bicho que voa: sombra no chão e asas batendo.
    for (let dx = -3; dx <= 3; dx++) setCell(b.x + dx, b.y, 32, 0, 0, 0);
    const flap = Math.sin(T * 16 + st.seed) * 2.5;
    for (const side of [-1, 1]) {
      C(side * 1, cy, side * 5, cy - 1.5 - flap, 0.7, st.col2);
      C(side * 5, cy - 1.5 - flap, side * 8, cy + 1 - flap * 0.6, 0.5, st.col2);
    }
  }
  if (st.tail) C(-f * L, cy, -f * (L + 3.5 * (st.tailLen || 1)), cy - 2 + Math.sin(T * 5) * 1.2, 0.6, st.col);
  for (let i = 0; i < pairs; i++) {
    const px = pairs === 1 ? 0 : -L + 2 * L * i / (pairs - 1);
    for (const side of [0, 1]) {
      const sw = moving ? Math.sin(ph * 1.5 + i * 2.1 + side * Math.PI) : 0, lift = Math.max(0, -sw) * 1.2;
      if (st.arch) {
        const out = px * 1.5 + (px < 0 ? -2 : 2) * (0.6 + side * 0.5);
        C(px, cy, out, cy - st.r * 0.7, 0.5, st.col2);
        C(out, cy - st.r * 0.7, out * 1.25 + sw, -0.4 - lift, 0.5, st.col2);
      } else {
        const lx2 = px + (pairs === 1 ? (side ? 0.9 : -0.9) : 0);
        C(lx2, cy, lx2 + sw * 2 * b.hf, -0.5 - lift, st.leg || 0.8, st.col2);
      }
    }
  }
  C(-L, cy, L, cy, st.r, st.col);
  // Pescoço levanta a cabeça (cavalo, avestruz, raptor).
  const hxp = f * (L + st.r * 0.5), hy = cy - st.r * 0.35 - (st.neck || 0);
  if (st.neck) C(f * L * 0.8, cy - st.r * 0.3, hxp, hy, st.r * 0.42, st.mane || st.col);
  const hr = st.head || st.r * 0.75;
  C(hxp, hy, hxp + f * st.r * 0.5, hy + 0.4, hr, st.col2);
  C(hxp + f * st.r * 0.5, hy - 0.3, hxp + f * st.r * 0.5, hy - 0.3, 0.5, st.eye || [255, 70, 50]);
  if (st.tusk) C(hxp + f * (hr + 0.6), hy + 0.9, hxp + f * (hr + 1.6), hy - 0.4, 0.4, [240, 232, 210]);
  if (st.ears) { C(hxp - 1.2, hy - st.r * 0.8, hxp - 1.2, hy - st.r * 1.2, 0.6, st.col); C(hxp + 1.2, hy - st.r * 0.8, hxp + 1.2, hy - st.r * 1.2, 0.6, st.col); }
}

  { beast: 4, len: 4, r: 3.4, h: 2.5, leg: 1.1, col: [112, 86, 66], col2: [84, 62, 48], head: 2.4, tusk: true, ears: true, eye: [30, 20, 16], seed: 91 },
  { beast: 2, len: 1.8, r: 3.4, h: 8, leg: 0.8, col: [52, 46, 52], col2: [232, 212, 190], mane: [220, 200, 180], neck: 8, head: 1.5, tail: true, tailLen: 0.5, eye: [20, 20, 20], seed: 92 },

// drawSteed desenha a montaria com as patas em (x, y).
