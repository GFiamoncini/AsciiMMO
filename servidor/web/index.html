// drawBoat desenha o casco com o fundo em (x, y), por cima das pernas.
function drawBoat(x, y, T) {
  for (let dy = -3; dy <= 1; dy++) {
    const half = dy === 1 ? 5 : 8 - Math.max(0, dy + 1);
    for (let dx = -half; dx <= half; dx++) {
      const rim = dy === -3 || Math.abs(dx) === half, k = 1.05 - 0.04 * (dx + half) + 0.06 * dy;
      const c = rim ? [168, 120, 72] : [116, 78, 46];
      setCell(x + dx, y + dy, rim ? 61 : 35, c[0] * k, c[1] * k, c[2] * k);
    }
  }
  if (Math.random() < 0.3) spawn('foam', x + (Math.random() - 0.5) * 18, y + 1, (Math.random() - 0.5) * 6, 1, 0.8);
}

// drawHerb desenha uma erva: antídoto (folhas com flor roxa), raiz-brasa
// (brotos em brasa que brilham) e babosa (folhas grossas em leque).
const HERB_COLS = [[[70, 170, 60], [190, 110, 230]], [[150, 60, 30], [255, 150, 60]], [[60, 160, 120], [150, 230, 190]]];
function drawHerb(h, T) {
  const [leaf, top] = HERB_COLS[h.k], sway = Math.sin(T * 2 + h.id) > 0.6 ? 1 : 0;
  for (let dy = -4; dy <= 0; dy++) {
    for (let dx = -3; dx <= 3; dx++) {
      if (Math.abs(dx) > 1 + (dy + 4) * 0.6 || hash2(dx, dy, h.k + 7) % 3 === 0) continue;
      const c = dy <= -3 ? top : leaf, k = 0.8 + 0.3 * ((hash2(dx, dy, h.id) & 255) / 255);
      setCell(h.x + dx + (dy < -2 ? sway : 0), h.y + dy, dy <= -3 ? 42 : '|/\\%'.charCodeAt((dx + 3) % 4), c[0] * k, c[1] * k, c[2] * k);
    }
  }
  if (h.k === 1) light(h.x, h.y, 16, 0.6, WARM, [70, 30, 0]);
}

// Animação de cada golpe, por classe e slot.
const ANIMS = [['swing', 'thrust', 'spin'], ['point', 'point', 'cast'], ['thrust', 'block', 'thrust'], ['swing', 'cast', 'cast'],
  ['point', 'point', 'cast'], ['swing', 'thrust', 'spin'], ['point', 'thrust', 'cast']];
const ANIM_DUR = { swing: 0.28, thrust: 0.3, spin: 0.5, point: 0.3, cast: 0.6, block: 0.4 };
const ease = t => t * t * (3 - 2 * t);

// drawBody desenha um corpo com os pés em (b.x, b.y).
//   face: +1 direita, -1 esquerda;  phase: fase do passo, ou null parado
//   hf: quanto o passo abre para os lados (1 andando de lado, menos subindo)
//   act: {anim, t, dir} durante um golpe;  sink: células ainda enterradas
function drawBody(b) {
  const st = b.style, s = st.scale || 1, f = b.face, act = b.act, T = b.T;
  let lx = 0, ly = 0;
  if (act && (act.anim === 'swing' || act.anim === 'thrust')) {
    const k = Math.sin(Math.PI * act.t) * 2.5;
    lx = Math.cos(act.dir) * k; ly = Math.sin(act.dir) * k;
  }
  E = { ox: b.x, oy: b.y + (b.sink | 0), clip: b.sink ? b.y : 1e9, flash: b.flash || 0, tint: b.tint || WHITE, seed: st.seed,
    mask: new Set() };
  const C = (ax, ay, bx, by, r, col) => cap(ax * s + lx, ay * s + ly, bx * s + lx, by * s + ly, r * s, col);

  const moving = b.phase !== null, ph = b.phase || 0, sw = moving ? Math.sin(ph) : 0;
  const bob = moving ? -Math.abs(Math.cos(ph)) * 0.8 : Math.sin(T * 2.4 + st.seed) * 0.4;
  const hipY = -12, neckY = -21 + bob, headY = -25 + bob;
  const limb = st.bone ? 0.8 : 1.4;

  if (st.cape) C(-f * 1.5, neckY + 1, -f * (2.5 + sw * 0.8), -5, 2.6, st.cape);

  // Braço de trás, balançando ao contrário das pernas.
  const sh = i => [i * 3.5, neckY + 1.8];
  const off = sh(-f), oa = moving ? -sw * 0.6 : 0.12;
  const oh = [off[0] - f * Math.sin(oa) * 8, off[1] + Math.cos(oa) * 8];
  C(off[0], off[1], oh[0], oh[1], limb * 0.85, st.arm);
  C(oh[0], oh[1], oh[0], oh[1], 0.9, st.skin);

  if (st.robe) {
    for (let y = hipY; y <= -1; y++) {
      const k = (y - hipY) / (-1 - hipY), half = 3.1 + 2.7 * k, sway = sw * 0.9 * k;
      C(-half + sway, y, half + sway, y, 0.6, st.torso);
    }
    C(-2 + sw, -0.4, -1 + sw, -0.4, 0.8, st.boots);
    C(1 - sw, -0.4, 2 - sw, -0.4, 0.8, st.boots);
  } else {
    for (const i of [-f, f]) {
      const lp = ph + (i === f ? 0 : Math.PI);
      const swing = moving ? Math.sin(lp) : 0, lift = moving ? Math.max(0, Math.cos(lp)) * 2.4 : 0;
      const hxp = i * 1.6, fx = hxp + swing * 3.6 * b.hf, fy = -lift - 0.6;
      const kx = (hxp + fx) / 2 + f * lift * 0.6, ky = (hipY + fy) / 2 - lift * 0.3;
      C(hxp, hipY, kx, ky, limb * 1.05, st.legs);
      C(kx, ky, fx, fy, limb * 0.9, st.legs);
      C(fx, fy + 0.2, fx + f * 1.3, fy + 0.2, 0.9, st.boots);
    }
  }

  if (st.bone) {
    C(0, hipY, 0, neckY, 0.8, st.torso);
    for (const y of [-20, -18, -16]) C(-3, y + bob, 3, y + bob, 0.55, st.torso);
    C(-2, hipY, 2, hipY, 0.9, st.torso);
    if (st.chest) C(0, -19.5 + bob, 0, -16.5 + bob, 2.7, st.chest);
  } else {
    C(0, hipY + bob * 0.5, 0, neckY, 3.2, st.torso);
    if (st.torso2) C(0, hipY + 1, 0, neckY + 1, 0.7, st.torso2);
    if (st.belt) C(-3, hipY + 0.6, 3, hipY + 0.6, 0.6, st.belt);
  }

  // Cabeça.
  const skull = st.head.startsWith('skull');
  C(0, headY, 0, headY, 3.3, st.head === 'helm' ? st.helm || STEEL : st.skin);
  if (skull) {
    C(-1.5 + f * 0.5, headY - 0.3, -1.5 + f * 0.5, headY - 0.3, 0.8, DARK);
    C(1.5 + f * 0.5, headY - 0.3, 1.5 + f * 0.5, headY - 0.3, 0.8, DARK);
    C(-1.2, headY + 2.7, 1.2, headY + 2.7, 0.5, DARK);
    if (st.head === 'skullhelm') C(-2.6, headY - 2.4, 2.6, headY - 2.4, 1.1, [132, 138, 168]);
    if (st.head === 'skullcrown') for (const dx of [-2.6, 0, 2.6]) C(dx, headY - 3, dx, headY - 5.4, 0.6, GOLD);
  } else if (st.head === 'helm') {
    C(-1.6 + f * 0.9, headY + 0.3, 1.6 + f * 0.9, headY + 0.3, 0.5, DARK);
    C(0, headY - 3.6, -f * 3, headY - 5, 0.9, st.plume);
  } else {
    C(f * 0.7 - 1.3, headY + 0.2, f * 0.7 - 1.3, headY + 0.2, 0.5, DARK);
    C(f * 0.7 + 1.3, headY + 0.2, f * 0.7 + 1.3, headY + 0.2, 0.5, DARK);
    if (st.head === 'hat') {
      C(-5, headY - 2, 5, headY - 2, 0.7, st.hat);
      for (let k = 0; k < 8; k++) { const h = 3.1 * (1 - k / 8); C(-h - f * k * 0.3, headY - 3 - k, h - f * k * 0.3, headY - 3 - k, 0.6, st.hat); }
    } else {
      C(-1.6, headY - 2, 1.6, headY - 2, 2, st.hair);
      C(-f * 2.7, headY - 1, -f * 2.7, headY + 1.6, 0.9, st.hair);
      if (st.head === 'circlet') C(-2.8, headY - 1.6, 2.8, headY - 1.6, 0.5, GOLD);
    }
  }

  // Braço da arma: em repouso a arma fica erguida; no golpe ela varre,
  // estoca, aponta ou sobe, conforme a animação.
  const ws0 = sh(f);
  let armA = Math.PI / 2 - f * (0.35 + (moving ? sw * 0.4 : 0)), wA = -Math.PI / 2 + f * 0.3, armLen = 7.5, glow = 0;
  if (act) {
    const t = act.t;
    if (act.anim === 'swing') armA = wA = act.dir + f * (-1.5 + 2.9 * ease(t));
    else if (act.anim === 'spin') armA = wA = act.dir + f * t * 2 * TAU;
    else if (act.anim === 'thrust') { armA = wA = act.dir; armLen = 5 + 5 * Math.sin(Math.PI * t); }
    else if (act.anim === 'point') { armA = wA = act.dir; glow = 1 - t; }
    else if (act.anim === 'cast') { armA = -Math.PI / 2 + f * 0.5; wA = -Math.PI / 2 + f * 0.1; glow = Math.sin(Math.PI * t); }
  }
  const hand = [ws0[0] + Math.cos(armA) * armLen, ws0[1] + Math.sin(armA) * armLen];
  const wc = Math.cos(wA), wsn = Math.sin(wA), tip = [hand[0] + wc * st.wlen, hand[1] + wsn * st.wlen];
  const blade = b.wcol || [236, 240, 255];
  if (st.weapon === 'sword') {
    C(hand[0], hand[1], tip[0], tip[1], 0.75, blade);
    C(hand[0] - wsn * 1.7, hand[1] + wc * 1.7, hand[0] + wsn * 1.7, hand[1] - wc * 1.7, 0.55, GOLD);
  } else if (st.weapon === 'staff') {
    C(hand[0] - wc * 5, hand[1] - wsn * 5, tip[0], tip[1], 0.6, WOOD);
    C(tip[0], tip[1], tip[0], tip[1], 1.7 + glow, mix3(b.wcol || st.orb, WHITE, 0.3 + 0.7 * glow + 0.15 * Math.sin(T * 5)));
  } else if (st.weapon === 'lance') {
    C(hand[0] - wc * 6, hand[1] - wsn * 6, tip[0], tip[1], 0.65, WOOD);
    C(tip[0] - wc * 4, tip[1] - wsn * 4, tip[0], tip[1], 0.9, blade);
  } else if (st.weapon === 'hammer') {
    C(hand[0], hand[1], tip[0], tip[1], 0.6, WOOD);
    C(tip[0] - wsn * 2.3, tip[1] + wc * 2.3, tip[0] + wsn * 2.3, tip[1] - wc * 2.3, 1.7, mix3(b.wcol || GOLD, WHITE, 0.4 + 0.6 * glow));
  } else if (st.weapon === 'bow') {
    // Arco: duas hastes abrindo a partir da mão, com a corda atrás.
    const fx = hand[0] + wc * 2.5, fy = hand[1] + wsn * 2.5;
    C(hand[0] - wsn * 6, hand[1] + wc * 6, fx, fy, 0.6, WOOD);
    C(hand[0] + wsn * 6, hand[1] - wc * 6, fx, fy, 0.6, WOOD);
    C(hand[0] - wsn * 6, hand[1] + wc * 6, hand[0] + wsn * 6, hand[1] - wc * 6, 0.3, blade);
  } else {
    C(hand[0], hand[1], tip[0], tip[1], 0.85, [200, 170, 130]);
  }
  C(ws0[0], ws0[1], hand[0], hand[1], limb * 0.85, st.arm);
  C(hand[0], hand[1], hand[0], hand[1], 0.9, st.skin);

  if (st.shield) {
    const guard = b.guard || act && act.anim === 'block';
    if (guard) C(f * 2, -16 + bob, f * 2, -14 + bob, 5.2, mix3(st.shield, WHITE, 0.35));
    else C(oh[0], oh[1] - 1, oh[0], oh[1] - 1, 3.4, st.shield);
  }

  // Rastro da lâmina e brilho da magia, por cima de tudo.
  const cx = b.x + ws0[0] * s + lx, cy = b.y + ws0[1] * s + ly, reach = (armLen + st.wlen) * s;
  if (act && act.anim === 'swing') {
    const a0 = act.dir - f * 1.5;
    for (let k = 0; k < 3; k++) ring(cx, cy, reach - k * 1.5, a0, armA, mix3([255, 255, 255], [120, 130, 170], k / 3 + act.t * 0.4));
  } else if (act && act.anim === 'spin') {
    for (let k = 0; k < 3; k++) ring(cx, cy, reach - k * 1.5, armA - f * 2.6, armA, mix3([255, 255, 255], [150, 160, 200], k / 3));
  } else if (act && act.anim === 'thrust') {
    streak(cx, cy, cx + Math.cos(act.dir) * (reach + 4), cy + Math.sin(act.dir) * (reach + 4), [220, 226, 255]);
  }
  if (b.wcol && Math.random() < 0.12) spawn('spark', b.x + tip[0] * s, b.y + tip[1] * s, (Math.random() - 0.5) * 8, -4 - Math.random() * 6, 0.4);
  if (glow > 0 && Math.random() < 0.6) {
    const kind = st.weapon === 'hammer' ? 'holy' : 'arcane';
    spawn(kind, b.x + tip[0] * s, b.y + tip[1] * s, (Math.random() - 0.5) * 14, (Math.random() - 0.5) * 14, 0.4);
  }
  if (glow > 0) light(b.x + tip[0] * s, b.y + tip[1] * s, 26, glow * 0.8, [0.4, 0.5, 1.3], [20, 30, 90]);
}

// ---------- fogo, projéteis e dragão ----------

function drawFire(fx, fy, size, T) {
  const step = T * 12 | 0, h = Math.round(13 * size), w = 5 * size;
  for (let dy = 0; dy < h; dy++) {
    const half = w * Math.pow(1 - dy / h, 0.7);
    for (let dx = -Math.ceil(w); dx <= Math.ceil(w); dx++) {
      const n = hash2(dx + fx, dy, step);
      if (Math.abs(dx) > half * (0.55 + 0.45 * (n & 255) / 255)) continue;
      const k = clamp(dy / h + Math.abs(dx) / (w * 1.8) + ((n >>> 8 & 255) / 255 - 0.5) * 0.3, 0, 1);
      const c = mix3([255, 236, 150], [255, 80, 24], k);
      setCell(fx + dx, fy - dy, '&W)(^*'.charCodeAt((n >>> 16) % 6), c[0], c[1], c[2]);
    }
  }
  if (size >= 1) for (let dx = -5; dx <= 5; dx++) setCell(fx + dx, fy + 1, 61, 120, 80, 44);
  else { setCell(fx, fy + 1, 124, 150, 110, 70); setCell(fx, fy + 2, 124, 120, 86, 54); }
}

// drawChest desenha um baú com a base em (cx, cy): fechado brilha, aberto
// fica com a tampa erguida até o dia seguinte.
function drawChest(cx, cy, opened, T) {
  for (let dy = -5; dy <= 0; dy++) {
    for (let dx = -4; dx <= 4; dx++) {
      if (opened && dy < -2) {
        if (dy === -5) setCell(cx + dx, cy + dy - 1, 61, 120, 84, 44);
        continue;
      }
      const band = dx === 0 || dy === -2, k = 1.05 - 0.07 * (dx + 4) + 0.05 * dy;
      const c = band ? [240, 200, 90] : [150, 98, 50];
      setCell(cx + dx, cy + dy, band ? 35 : rampCode(0.6 + 0.3 * k), c[0] * k, c[1] * k, c[2] * k);
    }
  }
  if (!opened) {
    light(cx, cy, 24, 0.5 + 0.2 * Math.sin(T * 3), WARM, [80, 60, 10]);
    if (Math.random() < 0.1) spawn('holy', cx + (Math.random() - 0.5) * 8, cy - 5, 0, -8, 0.6);
  }
  labels.push({ x: cx, y: cy - 8, text: opened ? 'Baú (aberto)' : 'Baú', color: opened ? '#6a6a76' : '#ffd070' });
}

// drawLoot desenha um item caído: um saquinho na cor do item, balançando;
// as armas brilham e soltam faíscas.
function drawLoot(l, T) {
  const it = info.items[l.item], c = hex(it.color), by = l.y - (Math.sin(T * 4 + l.id) > 0 ? 1 : 0);
  if (it.kind === 8) { // dinheiro: um montinho que brilha de leve
    for (let dy = -2; dy <= 0; dy++) {
      for (let dx = -3 - dy; dx <= 3 + dy; dx++) {
        const n = hash2(dx, dy, l.id);
        let k = 0.7 + 0.4 * (n & 255) / 255, code = 'o0c'.charCodeAt((n >>> 8) % 3);
        if ((n >>> 12) % 9 === (T * 4 | 0) % 9) { code = 42; k = 1.3; }
        setCell(l.x + dx, l.y + dy, code, 200 * k, 150 * k, 70 * k);
      }
    }
    labels.push({ x: l.x, y: l.y - 4, text: `${l.n} ${info.cur}`, color: '#e6be6e' });
    return;
  }
  for (let dy = -3; dy <= 0; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      if (dy === -3 && Math.abs(dx) > 1) continue;
      const k = 1.1 - 0.15 * (dx + 2) + 0.1 * dy;
      setCell(l.x + dx, by + dy, dy === -3 ? 37 : rampCode(0.55 + 0.4 * k), c[0] * k, c[1] * k, c[2] * k);
    }
  }
  if (it.kind) {
    light(l.x, l.y, 26, 0.7 + 0.2 * Math.sin(T * 5), COOL, [c[0] * 0.4, c[1] * 0.4, c[2] * 0.4]);
    if (Math.random() < 0.3) spawn('spark', l.x + (Math.random() - 0.5) * 6, by - 2, (Math.random() - 0.5) * 6, -8 - Math.random() * 8, 0.6);
  }
  labels.push({ x: l.x, y: by - 5, text: it.name, color: css(mix3(c, WHITE, 0.3)) });
}

// orb é uma bola de energia ou fogo, fervendo por dentro.
function orb(x, y, r, hot, cold, T) {
  const step = T * 20 | 0;
  for (let dy = -Math.ceil(r); dy <= Math.ceil(r); dy++) {
    for (let dx = -Math.ceil(r); dx <= Math.ceil(r); dx++) {
      const d = Math.hypot(dx, dy) / r, n = (hash2(dx, dy, step) & 255) / 255;
      if (d > 0.75 + n * 0.3) continue;
      const c = mix3(hot, cold, clamp(d * 1.1 + (n - 0.5) * 0.4, 0, 1));
      setCell(Math.round(x) + dx, Math.round(y) + dy, '@#&%*'.charCodeAt(clamp(d * 5 | 0, 0, 4)), c[0], c[1], c[2]);
    }
  }
}

// dragonClass é a mesma silhueta do servidor: diz que parte do dragão cobre
// o ponto, em unidades de duas células a partir do centro do corpo.
function dragonClass(px, py, t) {
  const ax = Math.abs(px);
  if (Math.abs(ax - 1) < 0.6 && Math.abs(py + 10.5) < 0.6) return 4;
  if (ax < 0.6 && py > -7 && py < 6) return 2;
  if (Math.hypot(px / 2.6, (py + 10) / 3) < 1) return 3;
  if (ax < 1.6 && py > -8 && py < -4) return 1;
  if (Math.hypot(px / 4.2, py / 7) < 1) return 1;
  if (py >= 6 && py <= 19) {
    const k = (py - 6) / 13;
    if (Math.abs(px - 3.5 * Math.sin(k * 4 + t * 2) * k) < 2.2 * (1 - k) + 0.5) return 1;
  }
  const flap = Math.sin(t * 3), span = 18 + 2.5 * flap;
  if (ax >= 3 && ax <= 3 + span) {
    const s = (ax - 3) / span;
    const top = -6 - 5 * s + 2 * flap * s;
    const bottom = 6 - 15 * s - 1.2 * Math.abs(Math.sin(s * Math.PI * 3)) + 2 * flap * s;
    if (py > top && py < bottom) return py < top + 1 || Math.abs(s * 3 % 1 - 0.5) > 0.43 ? 6 : 5;
  }
  return 0;
}
const DRAGON_COLORS = [null, [200, 100, 58], [240, 184, 144], [216, 120, 72], [255, 224, 96], [181, 82, 46], [232, 160, 112]];

// drawDragon pinta o chefe centrado em (cx, cy). Como sombra, só escurece o
// chão deslocado, para dar a impressão de voo.
function drawDragon(cx, cy, t, shadow, flash) {
  for (let dy = -34; dy <= 44; dy++) {
    const sy = cy + dy - y0;
    if (sy < 0 || sy >= rows) continue;
    for (let dx = -50; dx <= 50; dx++) {
      const sx = cx + dx - x0;
      if (sx < 0 || sx >= cols) continue;
      const px = dx / 2, py = dy / 2, cls = dragonClass(px, py, t);
      if (!cls) continue;
      const o = (sy * cols + sx) * 4;
      if (shadow) { buf[o] *= 0.25; buf[o + 1] *= 0.25; buf[o + 2] *= 0.3; continue; }
      const n = hash2(dx, dy, 99);
      let l = clamp(0.72 - px * 0.022 - py * 0.012 + ((n & 255) / 255 - 0.5) * 0.3, 0.28, 1);
      if (cls === 6) l = Math.min(1, l + 0.2);
      const c = DRAGON_COLORS[cls];
      buf[o] = c[0] * l + (255 - c[0] * l) * flash;
      buf[o + 1] = c[1] * l + (255 - c[1] * l) * flash;
      buf[o + 2] = c[2] * l + (255 - c[2] * l) * flash;
      buf[o + 3] = cls === 4 ? 79 : cls === 2 || cls === 6 ? 35 : rampCode(l);
    }
  }
}

// drawFx desenha os efeitos de área que o servidor mantém vivos.
function drawFx(e, T) {
  const cy = e.y - 14, p = e.p, fade = 1 - p;
  if (e.k === 11) { // chuva de flechas: o alvo no chão e as flechas descendo
    ring(e.x, e.y, e.r, 0, TAU, [230, 210, 170]);
    for (let i = 0; i < 12; i++) {
      const n = hash2(i, T * 30 | 0, 5);
      const ax = e.x + (n % 41 - 20) * e.r / 20, ay = e.y + ((n >>> 8) % 41 - 20) * e.r / 24 - 60 * fade;
      streak(ax + 6, ay - 12, ax, ay, [230, 210, 170]);
    }
  } else if (e.k === 13) drawBolt(e, T);
  else if (e.k === 12) {
    const r = e.r * ease(p);
    ring(e.x, cy, r, 0, TAU, mix3([200, 255, 210], [40, 10, 60], p));
    ring(e.x, cy, r * 0.7, 0, TAU, mix3([150, 90, 220], [30, 10, 50], p));
    light(e.x, e.y, e.r * 3, fade * 1.3, [0.6, 0.3, 1.2], [50, 10, 90]);
  } else if (e.k === 0) ring(e.x, cy, e.r + 4, e.dir - 1.1, e.dir + 1.1, mix3([200, 210, 240], [40, 40, 60], p));
  else if (e.k === 2 || e.k === 10) {
    ring(e.x, e.y, e.r, 0, TAU, [255, 90, 64]);
    ring(e.x, e.y, e.r * p, 0, TAU, [153, 32, 32]);
    if (e.k === 10) { // o meteoro vem caindo de cima enquanto o aviso fecha
      const mx = e.x + 34 * fade, my = e.y - 110 * fade;
      orb(mx, my, 5, [255, 250, 200], [255, 90, 24], T);
      for (let i = 0; i < 4; i++) spawn('fire', mx + (Math.random() - 0.5) * 6, my - 3, 20 + Math.random() * 20, -70 - Math.random() * 30, 0.5);
      light(mx, my + 20, 60, 0.9);
    }
  } else if (e.k === 3 || e.k === 7) {
    const fire = e.k === 3 || e.dir === 1, dark = !fire && e.dir === 3, r = e.r * (0.3 + 0.7 * ease(Math.min(1, p * 1.6)));
    const hot = fire ? [255, 250, 200] : dark ? [200, 255, 210] : [240, 240, 255];
    const cold = fire ? [255, 90, 24] : dark ? [90, 30, 130] : [110, 80, 230];
    if (p < 0.55) orb(e.x, e.k === 3 ? e.y : cy, r * (1 - p * 0.8), hot, cold, T);
    ring(e.x, e.k === 3 ? e.y : cy, r, 0, TAU, mix3(hot, [60, 20, 20], p));
    ring(e.x, e.k === 3 ? e.y : cy, Math.max(0, r - 1.5), 0, TAU, mix3(cold, [30, 10, 10], p));
    light(e.x, e.y, e.r * 4 + 20, fade * 1.6, fire ? WARM : [0.4, 0.5, 1.4], fire ? [120, 60, 0] : [30, 40, 120]);
  } else if (e.k === 5) {
    const ex = e.x + Math.cos(e.dir) * e.r, ey = cy + Math.sin(e.dir) * e.r, col = mix3([255, 255, 255], [50, 55, 90], p);
    for (const o of [-2, 0, 2]) streak(e.x - Math.sin(e.dir) * o, cy + Math.cos(e.dir) * o, ex - Math.sin(e.dir) * o, ey + Math.cos(e.dir) * o, o ? mix3(col, [20, 20, 40], 0.5) : col);
  } else if (e.k === 6) {
    for (let k = 0; k < 4; k++) {
      const a = p * 2 * TAU + k * Math.PI / 2;
      ring(e.x, cy, e.r * (0.55 + 0.45 * Math.min(1, p * 2)) - k % 2 * 2, a, a + 1.3, mix3([255, 255, 255], [90, 100, 150], p));
    }
  } else if (e.k === 8) {
    ring(e.x, e.y, e.r * ease(p), 0, TAU, mix3([170, 255, 180], [20, 60, 30], p));
    light(e.x, e.y, e.r * 1.6, fade * 0.8, [0.3, 1.1, 0.4], [10, 70, 20]);
  } else if (e.k === 9) {
    const r = e.r * ease(p);
    ring(e.x, cy, r, 0, TAU, mix3([255, 250, 210], [90, 60, 20], p));
    ring(e.x, cy, r * 0.6, 0, TAU, mix3([255, 226, 130], [60, 40, 10], p));
    for (let k = 0; k < 8; k++) {
      const a = k * Math.PI / 4 + 0.3;
      streak(e.x + Math.cos(a) * r * 0.3, cy + Math.sin(a) * r * 0.3, e.x + Math.cos(a) * r, cy + Math.sin(a) * r, mix3([255, 240, 170], [70, 50, 20], p));
    }
    light(e.x, e.y, e.r * 3, fade * 1.5, [1.2, 1.0, 0.4], [110, 90, 20]);
  }
}

let labels = [];
let fps = 0, frames = 0, fpsAt = 0, lastFrame = 0;
const walkPhase = new Map(); // fase do passo de cada personagem

function frame(now) {
  requestAnimationFrame(frame);
  resize();
  hx.setTransform(1, 0, 0, 1, 0, 0);
  hx.clearRect(0, 0, W, H);
  if (!map || !info || !cur) {
    gl.clearColor(0.035, 0.035, 0.06, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return;
  }
  const dt = clamp((now - lastFrame) / 1000, 0, 0.1);
  lastFrame = now;
  frames++;
  if (now - fpsAt >= 1000) { fps = Math.round(frames * 1000 / (now - fpsAt)); frames = 0; fpsAt = now; }

  if (cs !== csTarget && now - csAt > 40) { cs += Math.sign(csTarget - cs); csAt = now; }
  buildAtlas(cs);

  // Os personagens andam do estado anterior ao atual; um tick de atraso
  // compra movimento liso entre os 20 estados por segundo.
  const a = clamp((now - tCur) / 55, 0, 1);
  const T = cur.t + (now - tCur) / 1000;
  const at = (e, m) => {
    const o = m && m.get(e.id);
    if (!o || Math.abs(o.x - e.x) + Math.abs(o.y - e.y) > 70) return { x: e.x, y: e.y, vx: 0, vy: 0 };
    return { x: o.x + (e.x - o.x) * a, y: o.y + (e.y - o.y) * a, vx: e.x - o.x, vy: e.y - o.y };
  };
  const me = cur.pmap.get(info.id);
  if (!me) return;
  const mePos = at(me, prev && prev.pmap);

  const vw = W / cs, vh = H / cs;
  const camL = vw >= map.w ? (map.w - vw) / 2 : clamp(mePos.x - vw / 2, 0, map.w - vw);
  const camT = vh >= map.h ? (map.h - vh) / 2 : clamp(mePos.y - 14 - vh / 2, 0, map.h - vh);
  x0 = Math.floor(camL); y0 = Math.floor(camT);
  cols = Math.ceil(vw) + 2; rows = Math.ceil(vh) + 2;
  if (buf.length !== cols * rows * 4) buf = new Uint8Array(cols * rows * 4);
  meScreen = { x: (mePos.x - camL) * cs, y: (mePos.y - 14 - camT) * cs };

  // Luzes deste quadro: as fixas que alcançam a tela e as dos efeitos. As
  // dinâmicas entram um quadro depois de criadas, o que não se nota.
  const flick = 0.85 + 0.12 * Math.sin(T * 9) + 0.05 * Math.sin(T * 23);
  const lit = lights;
  lights = [];
  // Na cripta não há céu; lá fora as chamas rendem menos com o sol alto.
  const under = mePos.y >= info.overH, sun = under ? 0 : daylight(cur.tod);
  const amb = under ? [1, 1, 1] : ambient(sun), glowK = 1 - 0.7 * sun;
  const season = under ? 1 : cur.season, fall = SEASONS[season];
  for (let n = fall[2]; n > 0; n--) {
    if (Math.random() < n) spawn(fall[1], x0 + Math.random() * cols, y0 + Math.random() * rows * 0.9, -3 - Math.random() * 5, 6 + Math.random() * 6, 1.5 + Math.random());
  }
  labels = [];
  info.lights.forEach(([lxp, lyp, r, kind], i) => {
    if (lxp + r < x0 || lyp + r < y0 || lxp - r > x0 + cols || lyp - r > y0 + rows) return;
    if (kind === 3) lit.push({ x: lxp, y: lyp, r, r2: r * r, k: 0.9 + 0.1 * Math.sin(T * 1.5 + i), mul: SPORE, add: SPORE_ADD });
    else if (kind === 2) lit.push({ x: lxp, y: lyp, r, r2: r * r, k: glowK * (0.85 + 0.15 * Math.sin(T * 2 + i)), mul: COOL, add: COOL_ADD });
    else lit.push({ x: lxp, y: lyp, r, r2: r * r, k: glowK * flick * (0.9 + 0.1 * Math.sin(T * 7 + i * 2)), mul: WARM, add: WARM_ADD });
  });
  // No subsolo o jogador leva uma luz consigo; o resto fica no escuro.
  if (under) lit.push({ x: mePos.x, y: mePos.y - 10, r: 38, r2: 38 * 38, k: 0.9 * flick, mul: TORCH, add: TORCH_ADD });

  // Quem dobra o capim ao passar: personagens, inimigos e montarias na tela.
  const benders = [];
  for (const list of [cur.players, cur.mobs, cur.steeds]) {
    for (const e of list) if (e.x >= x0 - 6 && e.x < x0 + cols + 6 && e.y >= y0 - 4 && e.y < y0 + rows + 4) benders.push(e.x, e.y);
  }
  const wind = T * 1.6;

  // Terreno, com a luz e os vaga-lumes.
  const tw = T * 3 | 0, nl = lit.length;
  for (let sy = 0; sy < rows; sy++) {
    const wy = y0 + sy;
    for (let sx = 0; sx < cols; sx++) {
      const wx = x0 + sx, o = (sy * cols + sx) * 4;
      if (wx < 0 || wy < 0 || wx >= map.w || wy >= map.h) { buf[o + 3] = 0; continue; }
      const i = wy * map.w + wx;
      let ch = map.glyph[i], r = map.color[i * 3] * amb[0], g = map.color[i * 3 + 1] * amb[1], b = map.color[i * 3 + 2] * amb[2];
      // Estação: tudo que é verde é vegetação e muda de cor com ela; no
      // inverno a neve clareia também o chão.
      if (season !== 1 && !(map.flags[i] & 4)) {
        const veg = g > r * 1.08 && g > b * 1.05;
        if (season === 3) {
          const m = (r + g + b) / 3, k = veg ? 0.6 : 0.22;
          r += (m * 0.9 + 70 - r) * k; g += (m * 0.95 + 78 - g) * k; b += (m + 95 - b) * k;
        } else if (veg && season === 2) {
          const t = AUTUMN[(wx * 7 + wy * 13 >> 2) & 3], v = g;
          r = v * t[0]; g = v * t[1]; b = v * t[2];
        } else if (veg && (wx * 31 + wy * 17) % 11 === 0) { // primavera: flores entre as folhas
          r = g * 1.2 + 40; b = g * 0.9 + 40; g *= 0.75;
        }
      }
      if (map.flags[i] & 8) {
        // Lama: ondula devagar; a venenosa solta bolhas.
        const n = hash2(wx, wy, 11), v = Math.sin(wx * 0.4 + wy * 0.7 + T * 0.8 + (n & 7));
        ch = v > 0.5 ? 126 : v > -0.2 ? 45 : 46;
        if (map.flags[i] & 16 && (n >>> 8) % 61 === ((T * 2 | 0) % 61)) { ch = 111; r = 200; g = 255; b = 90; }
      } else if (map.flags[i] & 4) {
        // Água escura, como no vídeo de referência: quase preta, com cristas
        // finas correndo e um brilho aqui e ali. O reflexo entra depois.
        const v = Math.sin(wx * 0.31 + wy * 0.57 + T * 1.6 + (hash2(wx >> 2, wy >> 1, 3) & 7));
        ch = v > 0.7 ? 126 : v > 0.2 ? 45 : 32;
        r *= 0.32 + 0.2 * v; g *= 0.4 + 0.2 * v; b *= 0.55 + 0.2 * v;
        if (sun > 0.4 && (hash2(wx, wy, tw) & 511) === 0) { ch = 42; r = 220; g = 230; b = 255; }
      } else if (!under && !(map.flags[i] & 3) && ch !== 32 && g > r * 1.08 && g > b * 1.05) {
        // Capim: lâminas que o vento inclina em ondas e que se dobram para
        // os lados quando alguém passa por cima.
        const n = hash2(wx, wy, 21);
        if (n % 5 < 3) {
          const s = Math.sin(wx * 0.07 + wy * 0.025 - wind + (n >>> 4 & 3) * 0.5);
          ch = s > 0.45 ? 47 : s < -0.45 ? 92 : n & 64 ? 124 : 39;
          for (let k = 0; k < benders.length; k += 2) {
            const dx = wx - benders[k], dy = wy - benders[k + 1];
            if (dx > -6 && dx < 6 && dy > -3 && dy < 2) { ch = dx < 0 ? 92 : 47; g *= 0.85; break; }
          }
        }
      }
      if (ch !== 32) {
        for (let j = 0; j < nl; j++) {
          const L = lit[j], dx = wx - L.x, dy = wy - L.y, d2 = dx * dx + dy * dy;
          if (d2 >= L.r2) continue;
          let k = 1 - Math.sqrt(d2) / L.r;
          k *= k * L.k;
          r = r * (1 + L.mul[0] * k) + L.add[0] * k;
          g = g * (1 + L.mul[1] * k) + L.add[1] * k;
          b = b * (1 + L.mul[2] * k) + L.add[2] * k;
        }
        if (r > 255) r = 255;
        if (g > 255) g = 255;
        if (b > 255) b = 255;
      } else if (!map.flags[i] && sun < 0.3) {
        const n = hash2(wx, wy, 7);
        if (n % 97 === 0 && (tw + (n >>> 8)) % 8 < 5) { ch = n >>> 16 & 3 ? 46 : 42; r = 255; g = 244; b = 192; }
      }
      buf[o] = r; buf[o + 1] = g; buf[o + 2] = b; buf[o + 3] = ch;
    }
  }

  // Sombras projetadas: copas, paredes, rochas e falésias escurecem o chão
  // do lado oposto ao sol. É o que dá altura (2.5D) às coisas.
  const sdx = clamp((cur.tod - 0.5) * 3, -1.4, 1.4), sdy = 0.85;
  const shadeK = under ? 0 : 0.6 * daylight(cur.tod) * ([1, 0.6, 0.4, 0.5][cur.wx] || 1);
  if (shadeK > 0.05) {
    const tall = (x, y) => {
      if (x < 0 || y < 0 || x >= map.w || y >= map.h) return false;
      const j = y * map.w + x, f = map.flags[j];
      return f & 2 || (f & 1 && !(f & 4) && map.glyph[j] !== 32);
    };
    for (let sy = 0; sy < rows; sy++) {
      const wy = y0 + sy;
      for (let sx = 0; sx < cols; sx++) {
        const wx = x0 + sx;
        if (wx < 0 || wy < 0 || wx >= map.w || wy >= map.h || map.flags[wy * map.w + wx] & 7) continue;
        for (let k = 1; k <= 6; k++) {
          if (!tall(Math.round(wx - sdx * k * 1.5), Math.round(wy - sdy * k * 1.5))) continue;
          const o = (sy * cols + sx) * 4, f = 1 - shadeK * (1 - k / 9);
          buf[o] *= f; buf[o + 1] *= f; buf[o + 2] *= f * 1.05;
          break;
        }
      }
    }
  }
  const tbuf = buf.slice(); // o terreno como ficou, para o reflexo saber o que é só água

  for (const [lxp, lyp, , kind] of info.lights) if (kind < 2) drawFire(lxp, lyp, kind ? 0.4 : 1, T);
  info.chests.forEach(([cx, cy], i) => drawChest(cx, cy, cur.chests[i], T));
  for (const l of cur.loot) drawLoot(l, T);
  drawShops(me, T);
  bonfireLabels(me);
  for (const h of cur.herbs) {
    drawHerb(h, T);
    if (Math.hypot(h.x - mePos.x, h.y - mePos.y) < 40) labels.push({ x: h.x, y: h.y - 6, text: info.items[info.herbk[h.k]].name, color: '#b8f0a0' });
  }
  // Bolhas subindo do charco venenoso por perto.
  for (let k = 0; k < 3; k++) {
    const bx = x0 + Math.random() * cols | 0, by = y0 + Math.random() * rows | 0;
    if (bx >= 0 && by >= 0 && bx < map.w && by < map.h && map.flags[by * map.w + bx] & 16) spawn('bubble', bx, by, 0, -3, 1.2);
  }

  const boss = cur.boss;
  let bossPos = null;
  if (boss.alive) {
    bossPos = prev && prev.boss.alive ? { x: prev.boss.x + (boss.x - prev.boss.x) * a, y: prev.boss.y + (boss.y - prev.boss.y) * a } : boss;
    drawDragon(Math.round(bossPos.x) + 18, Math.round(bossPos.y) + 18, T, true, 0);
  }
  for (const e of cur.fx) if (e.k === 2 || e.k === 8 || e.k === 10) drawFx(e, T);

  // Personagens de trás para a frente.
  for (const p of info.portals) labels.push({ x: p.x, y: p.y - 10, text: p.label, color: '#b9a8ff' });
  const ents = [];
  for (const m of cur.mobs) ents.push({ mob: m, key: 'm' + m.id, pos: at(m, prev && prev.mmap) });
  for (const s of cur.steeds) ents.push({ steed: s, key: 's' + s.id, pos: at(s, prev && prev.smap) });
  for (const p of cur.players) ents.push({ player: p, key: p.id, pos: p === me ? mePos : at(p, prev && prev.pmap) });
  ents.sort((p, q) => p.pos.y - q.pos.y);
  // Sombra de cada personagem e bicho no chão, puxada para o lado oposto ao sol.
  for (const e of ents) {
    const big = e.steed || e.mob && MOB_STYLES[e.mob.k].beast ? 7 : 5, k = under ? 0.5 : 0.45 + 0.25 * shadeK;
    const cx = e.pos.x + sdx * 3, cy = e.pos.y + 0.5;
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -big - 2; dx <= big + 2; dx++) {
        const d = (dx / (big + 2)) ** 2 + (dy / 2.2) ** 2;
        if (d > 1) continue;
        const sx = Math.round(cx) + dx - x0, sy = Math.round(cy) + dy - y0;
        if (sx < 0 || sy < 0 || sx >= cols || sy >= rows) continue;
        const o = (sy * cols + sx) * 4, f = 1 - k * (1 - d * 0.6);
        buf[o] *= f; buf[o + 1] *= f; buf[o + 2] *= f;
      }
    }
  }
  for (const e of ents) {
    const moving = Math.abs(e.pos.vx) + Math.abs(e.pos.vy) > 0.05;
    const speed = Math.hypot(e.pos.vx, e.pos.vy);
    let ph = walkPhase.get(e.key) || 0;
    if (moving) { ph += dt * (4 + Math.min(10, speed * 5)); walkPhase.set(e.key, ph); }
    const b = { x: Math.round(e.pos.x), y: Math.round(e.pos.y), T, phase: moving ? ph : null,
      hf: Math.abs(e.pos.vx) >= Math.abs(e.pos.vy) ? 1 : 0.35, face: faces.get(e.key) || 1 };
    if (e.steed) {
      const s = e.steed, sk = info.steedk[s.k], st = STEED_STYLES[s.k];
      drawSteed(s.k, b.x, b.y, b.face, b.phase, T);
      const tame = me.lv >= sk.lv;
      labels.push({ x: e.pos.x, y: e.pos.y - saddleH(st) - st.r - 4 - (st.neck || 0), text: `${sk.name} · nível ${sk.lv}`, color: tame ? '#d8f0c0' : '#a08a8a' });
    } else if (e.mob) {
      const m = e.mob;
      b.style = MOB_STYLES[m.k];
      const tall = b.style.beast ? b.style.h + 2 * b.style.r + 6 : 30 * (b.style.scale || 1);
      b.sink = m.age < 0.8 ? Math.ceil(tall * (1 - m.age / 0.8)) : 0;
      if (m.hit < 0.15) { b.flash = 0.8; b.tint = WHITE; }
      if (m.atk < 0.3) {
        // Golpeia na direção do jogador mais próximo.
        let best = 1e9, dir = 0;
        for (const p of cur.players) { const d = Math.hypot(p.x - m.x, p.y - m.y); if (d < best) { best = d; dir = Math.atan2(p.y - m.y, p.x - m.x); } }
        b.act = { anim: 'swing', t: m.atk / 0.3, dir };
        b.face = Math.cos(dir) < 0 ? -1 : 1;
      }
      if (m.age < 0.8 && Math.random() < 0.5) spawn('smoke', b.x + (Math.random() - 0.5) * 8, b.y, (Math.random() - 0.5) * 10, -8, 0.5);
      (b.style.beast ? drawBeast : drawBody)(b);
      if (m.age >= 0.8) labels.push({ x: e.pos.x, y: e.pos.y - tall - 1, text: m.name, hp: m.hp, mhp: m.mhp, color: m.boss ? '#e0a8ff' : '#fff' });
    } else {
      const p = e.player, anim = ANIMS[p.cls][p.act], dur = ANIM_DUR[anim];
      b.style = playerStyle(p.cls, p.c, p.sk);
      if (b.style.aura && Math.random() < 0.3) spawn('holy', b.x + (Math.random() - 0.5) * 10, b.y - Math.random() * 26, 0, -6, 0.6);
      b.guard = p.guard;
      if (p.w) b.wcol = hex(info.items[p.w].color);
      if (p.aa < dur) {
        b.act = { anim, t: p.aa / dur, dir: p.ad };
        if (Math.abs(Math.cos(p.ad)) > 0.25) b.face = Math.cos(p.ad) < 0 ? -1 : 1;
      }
      if (p.hit < 0.2) { b.flash = 0.6; b.tint = RED; }
      // Montado, o bicho vai embaixo e o cavaleiro sobe até a sela; de barco,
      // as pernas somem dentro do casco.
      let lift = 0;
      if (p.mt) {
        const st = STEED_STYLES[p.mt - 1];
        drawSteed(p.mt - 1, b.x, b.y, b.face, b.phase, T);
        lift = Math.round(saddleH(st));
        b.y -= lift;
        b.phase = null; // quem anda é o bicho
      } else if (p.bt) b.sink = 7;
      drawBody(b);
      if (p.bt) drawBoat(b.x, b.y, T);
      if (p.guard) ring(b.x, b.y - 14, 9, T * 3, T * 3 + 4.5, [170, 200, 255]);
      labels.push({ x: e.pos.x, y: e.pos.y - 31 - lift + (p.bt ? 7 : 0), text: p.name, color: p === me ? '#ffe066' : '#fff',
        ...(p === me ? {} : { hp: p.hp, mhp: p.mhp }) });
    }
  }

  if (bossPos) {
    drawDragon(Math.round(bossPos.x), Math.round(bossPos.y), T, false, boss.hit < 0.12 ? 0.6 : 0);
    labels.push({ x: bossPos.x, y: bossPos.y - 36, text: 'Tiamath', hp: boss.hp, mhp: boss.mhp, color: '#fff' });
  }

  // Reflexo: cada célula de água que ainda é só água copia, espelhada na
  // linha da margem, o que está logo acima dela (árvores, casas, gente),
  // escurecida, azulada e tremendo com a ondulação.
  if (!under) {
    for (let sx = 0; sx < cols; sx++) {
      const wx = x0 + sx;
      let shore = -1;
      for (let sy = 0; sy < rows; sy++) {
        const wy = y0 + sy;
        if (wx < 0 || wy < 0 || wx >= map.w || wy >= map.h) continue;
        const f = map.flags[wy * map.w + wx];
        if (!(f & 4) || f & 8) { shore = sy; continue; }
        const o = (sy * cols + sx) * 4;
        if (shore < 0 || sy - shore > 46 || buf[o + 3] !== tbuf[o + 3] || buf[o] !== tbuf[o]) continue;
        const ry = 2 * shore - sy + 1, rx = sx + Math.round(Math.sin(wy * 0.7 + T * 2.4) * 0.8);
        if (ry < 0 || rx < 0 || rx >= cols) continue;
        const q = (ry * cols + rx) * 4;
        if (buf[q + 3] === 32 || buf[q + 3] === 0) continue;
        const fade = 0.55 * (1 - (sy - shore) / 50);
        buf[o] = buf[o] * (1 - fade) + buf[q] * 0.45 * fade;
        buf[o + 1] = buf[o + 1] * (1 - fade) + buf[q + 1] * 0.55 * fade;
        buf[o + 2] = buf[o + 2] * (1 - fade) + (buf[q + 2] * 0.7 + 30) * fade;
        buf[o + 3] = buf[q + 3];
      }
    }
  }
  // Ondulação: anéis achatados (a água é vista de cima, em perspectiva) em
  // volta dos barcos e de cada gota de chuva.
  for (const p of cur.players) {
    if (!p.bt) continue;
    const key = 'r' + p.id, last = rippleAt.get(key) || 0, o = prev && prev.pmap.get(p.id);
    if (now - last > 280 && o && (o.x !== p.x || o.y !== p.y)) { ripples.push({ x: p.x, y: p.y + 1, t: now, max: 9 }); rippleAt.set(key, now); }
  }
  drawRipples(now);

  // Projéteis: a bola de fogo deixa rastro de brasa e fumaça e ilumina o chão.
  for (const j of cur.projs) {
    const o = prev && prev.jmap.get(j.id);
    const x = o ? o.x + (j.x - o.x) * a : j.x, y = (o ? o.y + (j.y - o.y) * a : j.y) - 14;
    const vx = o ? j.x - o.x : 0, vy = o ? j.y - o.y : 0;
    if (j.k === 1) {
      orb(x, y, 3.4, [255, 250, 200], [255, 90, 24], T);
      for (let i = 0; i < 4; i++) spawn('fire', x + (Math.random() - 0.5) * 4, y + (Math.random() - 0.5) * 4, -vx * 4 + (Math.random() - 0.5) * 14, -vy * 4 + (Math.random() - 0.5) * 14, 0.25 + Math.random() * 0.35);
      if (Math.random() < 0.5) spawn('smoke', x, y, -vx * 2, -vy * 2 - 4, 0.8);
      light(x, y + 14, 46, 1.1);
    } else if (j.k === 2) {
      const ang = Math.atan2(vy, vx);
      streak(x - Math.cos(ang) * 7, y - Math.sin(ang) * 7, x, y, [230, 210, 170]);
      setCell(Math.round(x), Math.round(y), 42, 255, 255, 255);
    } else if (j.k === 3) {
      orb(x, y, 2.4, [200, 255, 210], [90, 30, 130], T);
      for (let i = 0; i < 2; i++) spawn('shadow', x + (Math.random() - 0.5) * 2, y + (Math.random() - 0.5) * 2, -vx * 3 + (Math.random() - 0.5) * 8, -vy * 3 + (Math.random() - 0.5) * 8, 0.3 + Math.random() * 0.3);
      light(x, y + 14, 28, 0.8, [0.6, 0.3, 1.2], [50, 10, 90]);
    } else {
      orb(x, y, 2, [240, 240, 255], [110, 80, 230], T);
      for (let i = 0; i < 2; i++) spawn('arcane', x + (Math.random() - 0.5) * 2, y + (Math.random() - 0.5) * 2, -vx * 3 + (Math.random() - 0.5) * 8, -vy * 3 + (Math.random() - 0.5) * 8, 0.2 + Math.random() * 0.25);
      light(x, y + 14, 30, 0.9, [0.4, 0.5, 1.4], [30, 40, 120]);
    }
  }

  for (const e of cur.fx) if (e.k !== 2 && e.k !== 8 && e.k !== 10) drawFx(e, T);
  drawParts(dt);

  if (!under) drawWeather(me, T, now);

  // Passe final, célula a célula: vinheta (as bordas escurecem, como uma
  // lente), céu fechado na chuva, clarão do raio e, no subsolo, o escuro em
  // que só se vê o que alguma luz alcança.
  const flash = Math.max(0, (flashUntil - now) / 160);
  const wdim = under ? 1 : [1, 0.86, 0.7, 0.8][cur.wx] || 1;
  const vy = new Float32Array(rows), vx = new Float32Array(cols);
  for (let sx = 0; sx < cols; sx++) vx[sx] = ((sx / cols - 0.5) * 2) ** 2;
  for (let sy = 0; sy < rows; sy++) vy[sy] = ((sy / rows - 0.45) * 2) ** 2;
  for (let sy = 0; sy < rows; sy++) {
    const wy = y0 + sy;
    for (let sx = 0; sx < cols; sx++) {
      const o = (sy * cols + sx) * 4;
      let f = Math.max(0.5, 1 - 0.3 * (vx[sx] + vy[sy])) * wdim;
      if (under) {
        const wx = x0 + sx;
        let vis = 0.035;
        for (let j = 0; j < nl; j++) {
          const L = lit[j], dx = wx - L.x, dy = wy - L.y, d2 = dx * dx + dy * dy;
          if (d2 >= L.r2) continue;
          const k = 1 - Math.sqrt(d2) / L.r;
          if (k > vis) vis = k;
        }
        f *= Math.min(1, vis * 1.6);
      }
      if (flash > 0) f = f * (1 + 1.6 * flash) + 0.5 * flash;
      // Clima sombrio: cores lavadas (puxadas para o cinza) e uma névoa fria
      // que corre devagar pelo chão, mais densa longe do centro.
      let r = buf[o], g = buf[o + 1], b = buf[o + 2];
      const lum = 0.3 * r + 0.59 * g + 0.11 * b;
      r += (lum - r) * 0.18; g += (lum - g) * 0.18; b += (lum - b) * 0.14;
      if (!under) {
        const fg = mistAt(x0 + sx, wy, T) * (0.35 + 0.65 * (vx[sx] + vy[sy]) * 0.5);
        r += (38 - r) * fg; g += (42 - g) * fg; b += (52 - b) * fg;
      }
      buf[o] = Math.min(255, r * f); buf[o + 1] = Math.min(255, g * f); buf[o + 2] = Math.min(255, b * f * (flash > 0 ? 1.1 : 1));
    }
  }
  if (under) labels = labels.filter(l => Math.hypot(l.x - mePos.x, l.y - mePos.y) < 60);

  // O trovão sacode a câmera por um instante.
  shake = Math.max(0, shake - dt * 3);
  const offX = Math.round((camL - x0) * cs + (Math.random() - 0.5) * shake * cs * 1.5);
  const offY = Math.round((camT - y0) * cs + (Math.random() - 0.5) * shake * cs * 1.5);
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, cols, rows, 0, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  gl.uniform2f(U.grid, cols, rows);
  gl.uniform3f(U.view, offX, offY, H);
  gl.uniform1f(U.cell, cs);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  drawLabels(camL, camT);
  drawFloats(camL, camT);
  drawHUD(me);
}

// ---------- nomes flutuantes e HUD, fora da grade ----------

// Os nomes seguem a posição exata do personagem, não a célula: por isso
// deslizam e podem se sobrepor, como no vídeo de referência.
function drawLabels(camL, camT) {
  const fs = clamp(cs * 1.7, 10 * dpr, 16 * dpr);
  hx.font = `bold ${fs}px ${FONT}`;
  hx.textAlign = 'center';
  hx.textBaseline = 'bottom';
  hx.lineJoin = 'round';
  for (const l of labels) {
    const x = (l.x - camL) * cs, bar = l.mhp ? Math.max(4 * dpr, fs * 0.36) : 0;
    const y = (l.y - camT) * cs - bar - 2;
    hx.lineWidth = fs * 0.28;
    hx.strokeStyle = 'rgba(0,0,0,.75)';
    hx.strokeText(l.text, x, y);
    hx.fillStyle = l.color;
    hx.fillText(l.text, x, y);
    if (l.mhp) {
      // Barra de vida: mais larga para quem tem mais vida, e a cor cai do
      // verde ao vermelho conforme esvazia.
      const w = clamp(Math.sqrt(l.mhp) * 4.5, 34, 160) * dpr, k = clamp(l.hp / l.mhp, 0, 1);
      hx.fillStyle = '#000';
      hx.fillRect(x - w / 2 - dpr, y + 1, w + 2 * dpr, bar + 2 * dpr);
      hx.fillStyle = '#3a1010';
      hx.fillRect(x - w / 2, y + 1 + dpr, w, bar);
      hx.fillStyle = k > 0.5 ? '#58d058' : k > 0.25 ? '#e0c040' : '#e04838';
      hx.fillRect(x - w / 2, y + 1 + dpr, w * k, bar);
    }
  }
}

const RIGHT_W = 300;

// ---------- tela de personagem ----------
// Boneco com os espaços de equipamento em volta, mochila em grade, ficha do
// item sob o mouse e atributos. Cada item é um símbolo, no espírito do jogo.
const RARC = ['#c8c8d0', '#6aa8ff', '#c880ff', '#ffb040'], RAR_NAMES = ['comum', 'raro', 'épico', 'lendário'];
const KIND_NAMES = ['consumível', 'arma', 'armadura', 'elmo', 'botas', 'amuleto', 'material', 'erva'];
const WEAPON_ICONS = ['/', "'", '|', 'T', '?', ')', 'W']; // espada, adaga, lança, martelo, cajado, arco, garra
const itemIcon = it => it.kind === 1 ? WEAPON_ICONS[it.wt] : ['!', '', 'M', '^', 'L', 'o', '#', '*'][it.kind];
// Espaços, na ordem em que o servidor manda o equipamento: nome e posição
// (coluna, linha) em volta do boneco.
const GEAR_SLOTS = [['arma', -1.3, 1.2], ['elmo', 0, 0], ['armadura', 0, 1.2], ['botas', 0, 2.4], ['amuleto', 1.3, 1.2]];
const weaponPct = it => Math.floor(it.bonus * (info.aff.includes(it.wt) ? info.affPct[0] : info.affPct[1]) / 100);

function drawSheet(me, cw, chh, lh, panel, text) {
  const S = 58, G = 6, w = 700, h = 476, x0 = Math.max(8, Math.round((cw - RIGHT_W - w) / 2)), y0 = Math.max(8, Math.round((chh - h) / 2) - 10);
  panel(x0, y0, w, h, '#ffe066');
  text('Personagem — clique numa peça para equipar, usar ou tirar (I fecha)', x0 + 14, y0 + 10, '#ffe066');
  let hover = null;
  const worn = id => id > 0 && cur.gear.includes(id);
  // cell desenha um quadro de item; vazio mostra o nome do espaço.
  const cell = (x, y, id, n, label) => {
    const it = id === null ? null : info.items[id], on = it && worn(id) && !label;
    hx.fillStyle = '#0c0c14';
    hx.fillRect(x, y, S, S);
    hx.strokeStyle = it ? RARC[it.rar] : '#3a3a48';
    hx.lineWidth = it ? 2 : 1;
    hx.strokeRect(x + 1, y + 1, S - 2, S - 2);
    if (!it) {
      hx.font = `11px ${FONT}`;
      hx.textAlign = 'center';
      text(label, x + S / 2, y + S / 2 - 6, '#4a4a58');
    } else {
      hx.font = `bold 30px ${FONT}`;
      hx.textAlign = 'center';
      text(itemIcon(it), x + S / 2, y + 11, css(mix3(hex(it.color), WHITE, 0.2)));
      hx.font = `11px ${FONT}`;
      if (n > 1) { hx.textAlign = 'right'; text('x' + n, x + S - 5, y + S - 15, '#fff'); }
      if (on) { hx.textAlign = 'left'; text('E', x + 5, y + 4, '#ffe066'); }
      uiRects.push({ x, y, w: S, h: S, act: { t: 'item', item: id } });
      if (mouseX >= x && mouseX < x + S && mouseY >= y && mouseY < y + S) hover = it;
    }
    hx.font = `13px ${FONT}`;
    hx.textAlign = 'left';
  };

  // Boneco: uma silhueta atrás dos espaços.
  const dx = x0 + 150, top = y0 + 44, row = S + 12;
  hx.fillStyle = '#16161f';
  hx.beginPath();
  hx.arc(dx, top + S / 2, 40, 0, TAU);
  hx.fill();
  hx.fillRect(dx - 52, top + row * 1.2 - 8, 104, S + 30);
  hx.fillRect(dx - 118, top + row * 1.2 + 4, 236, 26);
  hx.fillRect(dx - 44, top + row * 2.4 - 20, 36, S + 24);
  hx.fillRect(dx + 8, top + row * 2.4 - 20, 36, S + 24);
  GEAR_SLOTS.forEach(([name, col, r], i) => cell(dx - S / 2 + col * (S + 14), top + r * row, cur.gear[i] || null, 1, name));

  let y = top + row * 2.4 + S + 14;
  const line = (label, value, color) => {
    text(label, x0 + 20, y, '#8a8a96');
    hx.textAlign = 'right';
    text(value, x0 + 290, y, color || '#e6e6e6');
    hx.textAlign = 'left';
    y += lh;
  };
  line('Dano do golpe básico', cur.dmg[0] + '%');
  line('Dano dos golpes de classe', cur.dmg[1] + '%');
  line('Proteção', cur.def + '%');
  y += 6;
  text(`Atributos — ${cur.pts} ponto(s) a gastar`, x0 + 20, y, cur.pts ? '#7dff7d' : '#ffe066');
  y += lh;
  info.attrs.forEach(([name, desc], i) => {
    if (cur.pts) uiRects.push({ x: x0 + 14, y: y - 2, w: 282, h: lh, act: { t: 'attr', i } });
    text(`${cur.pts ? '[+]' : '   '} ${name} ${cur.attr[i]}`, x0 + 20, y, cur.pts ? '#7dff7d' : '#e6e6e6');
    hx.textAlign = 'right';
    text(desc.split(' (')[0], x0 + 290, y, '#8a8a96');
    hx.textAlign = 'left';
    y += lh;
  });

  // Mochila: 12 espaços em grade.
  const gx = x0 + 330, gy = y0 + 62;
  text(`Mochila — ${cur.inv.length}/12`, gx, y0 + 40, '#ffe066');
  for (let i = 0; i < 12; i++) {
    const sl = cur.inv[i];
    cell(gx + i % 4 * (S + G), gy + (i / 4 | 0) * (S + G), sl ? sl[0] : null, sl ? sl[1] : 0, '');
  }

  // Ficha do item sob o mouse.
  const fy = gy + 3 * (S + G) + 8, fw = 4 * S + 3 * G + 92;
  hx.strokeStyle = '#3a3a48';
  hx.lineWidth = 1;
  hx.strokeRect(gx + 0.5, fy + 0.5, fw, 6.2 * lh);
  if (!hover) {
    text('Passe o mouse sobre um item para ver', gx + 10, fy + 8, '#6a6a76');
    text('o que ele faz. A borda mostra a raridade:', gx + 10, fy + 8 + lh, '#6a6a76');
    RAR_NAMES.forEach((n, i) => text(n, gx + 10 + i * 78, fy + 8 + 2.4 * lh, RARC[i]));
    text('E = equipado. Números 1-9 usam o item.', gx + 10, fy + 8 + 3.8 * lh, '#6a6a76');
  } else {
    const it = hover, fits = it.kind === 1 && info.aff.includes(it.wt), stats = [];
    if (it.kind === 1) stats.push(`+${weaponPct(it)}% de dano (${fits ? 'com' : 'sem'} afinidade da classe)`);
    else if (it.kind === 0 || it.kind >= 6) stats.push(it.desc);
    else {
      if (it.def) stats.push(`+${it.def}% de proteção`);
      if (it.bonus) stats.push(`+${it.bonus}% de dano`);
      if (it.magic) stats.push(`+${it.magic}% de dano mágico (classes mágicas)`);
    }
    text(it.name, gx + 10, fy + 8, RARC[it.rar]);
    text(`${RAR_NAMES[it.rar]} · ${it.kind === 1 ? info.wtypes[it.wt] : KIND_NAMES[it.kind]}`, gx + 10, fy + 8 + lh, '#8a8a96');
    stats.forEach((s, i) => text(s, gx + 10, fy + 8 + (2.2 + i) * lh, '#e6e6e6'));
    if (it.kind) text('Origem: ' + it.desc, gx + 10, fy + 8 + 5 * lh, '#6a6a76');
  }
  // O resto da janela engole o clique, para não sair golpe por trás dela.
  uiRects.push({ x: x0, y: y0, w, h, fn: () => {} });
}

// Névoa do mapa: uma célula do minimapa só aparece depois de o jogador
// passar perto. Fica guardada neste navegador, por personagem.
let fog = null, fogDirty = false, fogAt = 0, fogLast = -1;
const fogc = document.createElement('canvas');
const fogKey = () => 'asciimmo.fog2.' + charName.toLowerCase();
function initFog() {
  fog = new Uint8Array(mini.width * mini.height);
  try {
    const raw = atob(localStorage.getItem(fogKey()) || '');
    for (let i = 0; i < fog.length && i >> 3 < raw.length; i++) fog[i] = raw.charCodeAt(i >> 3) >> (i & 7) & 1;
  } catch (e) { /* sem armazenamento: a névoa recomeça a cada visita */ }
  fogc.width = mini.width; fogc.height = mini.height;
  const c = fogc.getContext('2d');
  c.fillStyle = '#05050a';
  c.fillRect(0, 0, fogc.width, fogc.height);
  for (let i = 0; i < fog.length; i++) if (fog[i]) c.clearRect(i % mini.width, i / mini.width | 0, 1, 1);
  fogLast = -1;
}
function reveal(me, now) {
  const mx = me.x / MM | 0, my = me.y / MM | 0, R = 28;
  if (my * mini.width + mx !== fogLast) {
    fogLast = my * mini.width + mx;
    const c = fogc.getContext('2d');
    for (let dy = -R; dy <= R; dy++) {
      for (let dx = -R; dx <= R; dx++) {
        const x = mx + dx, y = my + dy, i = y * mini.width + x;
        if (dx * dx + dy * dy > R * R || x < 0 || y < 0 || x >= mini.width || y >= mini.height || fog[i]) continue;
        fog[i] = 1; fogDirty = true;
        c.clearRect(x, y, 1, 1);
      }
    }
  }
  if (fogDirty && now - fogAt > 10000) {
    fogAt = now; fogDirty = false;
    let s = '';
    for (let i = 0; i < fog.length; i += 8) {
      let b = 0;
      for (let k = 0; k < 8; k++) b |= (fog[i + k] || 0) << k;
      s += String.fromCharCode(b);
    }
    try { localStorage.setItem(fogKey(), btoa(s)); } catch (e) { /* idem */ }
  }
}

// Lá fora o mapa mostra o continente; no subsolo, só a zona onde o jogador está.
const zoneOf = me => info.zones.find(z => me.x >= z.x && me.x < z.x + z.w && me.y >= z.y && me.y < z.y + z.h) || info.zones[0];
const mapSrc = me => me.y >= info.overH ? zoneOf(me) : { x: 0, y: 0, w: map.w, h: info.overH };

// drawMap desenha o mapa (pequeno ou grande) com a névoa e os pontos de
// interesse já descobertos; no grande entram os nomes das regiões.
function drawMap(me, x, y, mw, mh, src, big) {
  hx.imageSmoothingEnabled = false;
  for (const img of [mini, fogc]) hx.drawImage(img, src.x / MM, src.y / MM, src.w / MM, src.h / MM, x, y, mw, mh);
  const seen = (wx, wy) => fog[(wy / MM | 0) * mini.width + (wx / MM | 0)];
  const dot = (wx, wy, color, size) => {
    if (wx < src.x || wy < src.y || wx > src.x + src.w || wy > src.y + src.h) return;
    hx.fillStyle = color;
    hx.fillRect(x + (wx - src.x) / src.w * mw - size / 2, y + (wy - src.y) / src.h * mh - size / 2, size, size);
  };
  const s = big ? 2 : 0;
  for (const p of info.portals) if (seen(p.x, p.y)) dot(p.x, p.y, '#b9a8ff', 4 + s);
  info.chests.forEach(([cx, cy], i) => { if (seen(cx, cy)) dot(cx, cy, cur.chests[i] ? '#6a6a76' : '#ffd070', 4 + s); });
  for (const m of cur.mobs) if (m.boss && seen(m.x, m.y)) dot(m.x, m.y, '#ff5ad0', 5 + s);
  if (cur.boss.alive && seen(cur.boss.x, cur.boss.y)) dot(cur.boss.x, cur.boss.y, '#ff4030', 6 + s);
  for (const p of cur.players) if (p !== me) dot(p.x, p.y, css(playerColor(p.c)), 4 + s);
  dot(me.x, me.y, '#000', 7 + s);
  dot(me.x, me.y, '#ffe066', 5 + s);
  if (!big || src.y) return;
  hx.font = `bold 13px ${FONT}`;
  hx.textAlign = 'center';
  info.regions.forEach((r, ri) => {
    if (!seen(r.x, r.y)) return;
    const tx = x + r.x / src.w * mw, ty = y + (r.y - r.r * 0.5) / src.h * mh, sealed = sealedBy(ri) >= 0;
    const name = sealed ? r.name + ' (selado)' : r.name;
    hx.fillStyle = 'rgba(0,0,0,.7)';
    hx.fillRect(tx - hx.measureText(name).width / 2 - 3, ty - 2, hx.measureText(name).width + 6, 17);
    hx.fillStyle = sealed ? '#c080ff' : '#fff';
    hx.fillText(name, tx, ty);
  });
  hx.font = `13px ${FONT}`;
  hx.textAlign = 'left';
}
const wrap = (s, max) => {
  const out = [];
  let line = '';
  for (const w of s.split(' ')) {
    if (line && (line + ' ' + w).length > max) { out.push(line); line = w; } else line = line ? line + ' ' + w : w;
  }
  if (line) out.push(line);
  return out;
};

// drawRight é a coluna da direita: minimapa com os pontos de interesse,
// região e hora, missão atual e mochila.
function drawRight(me, cw, ch, lh, panel, text) {
  const x = cw - 8 - RIGHT_W, under = me.y >= info.overH;
  // Lá fora o minimapa mostra o continente; na cripta, só a cripta.
  const src = mapSrc(me), hh = 1.4 * lh;
  const mw = RIGHT_W - 2, mh = Math.round(mw * src.h / src.w);
  if (!fog) initFog();
  reveal(me, performance.now());
  // Cabeçalho do mapa: clicar nele (ou na seta) recolhe e abre o minimapa.
  uiRects = [{ x, y: 8, w: RIGHT_W, h: hh, fn: () => {
    mapShut = !mapShut;
    try { localStorage.setItem('asciimmo.mapShut', mapShut ? '1' : '0'); } catch (e) { /* sem armazenamento */ }
  } }];
  panel(x, 8, RIGHT_W, hh);
  text('Mapa', x + ch, 8 + lh * 0.2, '#8a8a96');
  text('[M] ampliar', x + 7 * ch, 8 + lh * 0.2, '#6a6a76');
  const ax = x + RIGHT_W - 16, ay = 8 + hh / 2;
  hx.fillStyle = '#ffe066';
  hx.beginPath();
  if (mapShut) { hx.moveTo(ax - 4, ay - 6); hx.lineTo(ax + 5, ay); hx.lineTo(ax - 4, ay + 6); }
  else { hx.moveTo(ax - 6, ay - 4); hx.lineTo(ax + 6, ay - 4); hx.lineTo(ax, ay + 5); }
  hx.fill();
  if (!mapShut) {
    panel(x, 8 + hh, RIGHT_W, mh + 2);
    drawMap(me, x + 1, 9 + hh, mw, mh, src, false);
  }

  let y = 8 + hh + (mapShut ? 0 : mh + 2);
  let place = under ? zoneOf(me).name : 'Ermos';
  if (!under) for (const r of info.regions) if (Math.hypot(me.x - r.x, me.y - r.y) <= r.r) { place = r.name; break; }
  const mins = Math.floor(cur.tod * 1440), day = daylight(cur.tod) > 0.3;
  panel(x, y, RIGHT_W, 1.6 * lh);
  text(place, x + ch, y + lh * 0.3);
  hx.textAlign = 'right';
  text(`${SEASONS[cur.season][0]} · ${['', 'chuva · ', 'tempestade · ', 'neblina · '][cur.wx] || ''}${String(mins / 60 | 0).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')} ${day ? 'dia' : 'noite'}`, x + RIGHT_W - ch, y + lh * 0.3, day ? '#ffe066' : '#8aa0ff');
  hx.textAlign = 'left';
  y += 1.6 * lh;

  const cols = Math.floor((RIGHT_W - 2 * ch) / ch), q = cur.quest;
  const lines = q ? wrap(q.text, cols) : ['A história terminou. Tiamath está morta.'];
  // Secundárias ativas: do capítulo atual para trás, ainda não concluídas.
  const sides = info.sides.map((s, i) => ({ ...s, i })).filter(s => cur.chap >= s.ch && !(cur.sdone >> s.i & 1));
  let qh = lines.length + (q ? 2.6 : 0.6);
  if (sides.length) qh += 1.2 + sides.length;
  panel(x, y, RIGHT_W, qh * lh);
  if (sides.length) {
    const sy = y + (qh - sides.length - 0.9) * lh;
    text('Secundárias (quebram selos)', x + ch, sy, '#c080ff');
    sides.forEach((s, k) => {
      text(s.title, x + ch, sy + lh * (k + 1));
      hx.textAlign = 'right';
      text(`${(cur.sprog || [])[s.i] || 0}/${s.need}`, x + RIGHT_W - ch, sy + lh * (k + 1), '#7dff7d');
      hx.textAlign = 'left';
    });
  }
  if (q) {
    const chap = q.ch >= 1 && q.ch <= info.chapters.length ? info.chapters[q.ch - 1][0].split(' — ')[0] + ' · ' : '';
    text(`${chap}Missão ${q.n}/${q.of}`, x + ch, y + lh * 0.3, '#8a8a96');
    text(q.title, x + ch, y + lh * 1.3, '#ffe066');
    lines.forEach((l, i) => text(l, x + ch, y + lh * (2.3 + i)));
    if (q.need > 1) { hx.textAlign = 'right'; text(`${q.prog}/${q.need}`, x + RIGHT_W - ch, y + lh * 0.3, '#7dff7d'); hx.textAlign = 'left'; }
  } else text(lines[0], x + ch, y + lh * 0.3, '#7dff7d');
  y += qh * lh;

  // Menu: as teclas dos painéis, com aviso quando há ponto para gastar, e o
  // estado do comando de voz.
  const potions = (cur.inv.find(s => s[0] === 0) || [0, 0])[1];
  panel(x, y, RIGHT_W, 3.6 * lh);
  const fresh = performance.now() - voiceAt < 4000;
  text(`[V] voz ${voiceOn ? 'ligada' : 'desligada'}${fresh ? ' — ' + voiceMsg : ''}`, x + ch, y + lh * 2.3, voiceOn ? '#7dff7d' : fresh ? '#ffb040' : '#8a8a96');
  text('[I] personagem', x + ch, y + lh * 0.3, cur.pts ? '#7dff7d' : openPanel === 'sheet' ? '#ffe066' : '#8a8a96');
  text('[K] habilid.', x + ch, y + lh * 1.3, cur.spts ? '#7dff7d' : openPanel === 'tree' ? '#ffe066' : '#8a8a96');
  text('[J] conquistas', x + 16 * ch, y + lh * 1.3, openPanel === 'ach' ? '#ffe066' : '#8a8a96');
  hx.textAlign = 'right';
  text('[M]apa', x + RIGHT_W - ch, y + lh * 0.3, bigMap ? '#ffe066' : '#8a8a96');
  text(`[Q] x${potions}`, x + RIGHT_W - ch, y + lh * 1.3, potions ? '#ff8090' : '#6a6a76');
  hx.textAlign = 'left';
  y += 3.6 * lh;

  // Um painel de cada vez. Linha com ação aceita clique.
  const RAR = ['#c8c8d0', '#6aa8ff', '#c880ff', '#ffb040']; // comum, raro, épico, lendário
  const row = (i, left, right, color, act, rcolor) => {
    const ry = y + lh * (1.3 + i);
    text(left, x + ch, ry, color);
    if (right) { hx.textAlign = 'right'; text(right, x + RIGHT_W - ch, ry, rcolor || '#8a8a96'); hx.textAlign = 'left'; }
    if (act) uiRects.push({ x, y: ry - 2, w: RIGHT_W, h: lh, act });
  };
  const open = (title, n) => {
    panel(x, y, RIGHT_W, (Math.max(1, n) + 1.6) * lh, '#ffe066');
    text(title, x + ch, y + lh * 0.3, '#ffe066');
  };
  if (openPanel === "tree") {
    const spent = cur.tree.reduce((a, b) => a + b, 0);
    open(`Habilidades — ${cur.spts} ponto(s) a gastar`, info.tree.length * 2);
    info.tree.forEach((n, i) => {
      const need = (i >> 1) * 3, locked = spent < need, can = cur.spts > 0 && !locked && cur.tree[i] < n.max;
      row(i * 2, `${can ? '[+] ' : ''}${n.name}`, locked ? `pede ${need} pontos` : `${cur.tree[i]}/${n.max}`,
        locked ? '#6a6a76' : can ? '#7dff7d' : '#e6e6e6', can ? { t: 'tree', i } : null);
      row(i * 2 + 1, `  ${n.desc}`, '', '#8a8a96');
    });
  } else if (openPanel === 'ach') {
    const got = i => cur.ach >> i & 1;
    let line = 0;
    open(`Conquistas — ${info.achs.filter((_, i) => got(i)).length}/${info.achs.length}`, info.achs.length + info.achs.filter((_, i) => !got(i)).length);
    info.achs.forEach(([name, desc], i) => {
      row(line++, `${got(i) ? '[x]' : '[ ]'} ${name}`, '', got(i) ? '#ffe066' : '#e6e6e6');
      if (!got(i)) row(line++, `    ${desc}`, '', '#8a8a96');
    });
  }
}

// ---------- história, loja, textos flutuantes ----------

const floats = [], popSeen = new Set();
let deathAt = 0, chapterAt = 0, lastChapter = 0, shopIdx = -1, showFPS = true;
try { showFPS = localStorage.getItem('asciimmo.fps') !== '0'; } catch (e) { /* sem armazenamento */ }

// takePops recebe os textos novos do servidor; o de morte vira a tela "Você pereceu".
function takePops(m) {
  for (const p of m.pops || []) {
    if (popSeen.has(p.id)) continue;
    popSeen.add(p.id);
    if (p.k === 1) { deathAt = performance.now(); continue; }
    floats.push({ text: p.text, c: hex(p.c), x: p.x, y: p.y, t0: performance.now() });
  }
  if (m.chap !== lastChapter) {
    if (m.chap >= 1 && info && m.chap <= info.chapters.length) chapterAt = performance.now();
    lastChapter = m.chap;
  }
}

// Textos subindo e sumindo sobre o mundo (XP, dinheiro, avisos).
function drawFloats(camL, camT) {
  const now = performance.now();
  hx.setTransform(1, 0, 0, 1, 0, 0);
  hx.font = `bold ${14 * dpr}px ${FONT}`;
  hx.textAlign = 'center';
  hx.textBaseline = 'top';
  let n = 0;
  for (const f of floats) {
    const age = (now - f.t0) / 2200;
    if (age >= 1) continue;
    floats[n++] = f;
    const x = (f.x - camL) * cs, y = (f.y - camT) * cs - 26 * dpr * age, a = Math.min(1, (1 - age) * 1.6);
    hx.fillStyle = `rgba(0,0,0,${a})`;
    hx.fillText(f.text, x + dpr, y + dpr);
    hx.fillStyle = `rgba(${f.c[0]},${f.c[1]},${f.c[2]},${a})`;
    hx.fillText(f.text, x, y);
  }
  floats.length = n;
}

// Abertura do capítulo e tela de morte, por cima de tudo.
function drawOverlays(cw, chh) {
  const now = performance.now();
  hx.textAlign = 'center';
  hx.textBaseline = 'top';
  let t = (now - deathAt) / 3500;
  if (deathAt && t < 1) {
    const a = Math.min(1, t * 4, (1 - t) * 2.5);
    hx.fillStyle = `rgba(0,0,0,${0.78 * a})`;
    hx.fillRect(0, chh * 0.38, cw, chh * 0.2);
    hx.font = `bold 44px ${FONT}`;
    hx.fillStyle = `rgba(190,24,24,${a})`;
    hx.fillText('Você pereceu', cw / 2, chh * 0.42);
    hx.font = `14px ${FONT}`;
    hx.fillStyle = `rgba(140,120,110,${a})`;
    hx.fillText('a chama da última fogueira te chama de volta', cw / 2, chh * 0.42 + 56);
  }
  t = (now - chapterAt) / 7000;
  if (chapterAt && t < 1 && lastChapter >= 1 && lastChapter <= info.chapters.length) {
    const a = Math.min(1, t * 5, (1 - t) * 3), c = info.chapters[lastChapter - 1];
    hx.fillStyle = `rgba(0,0,0,${0.66 * a})`;
    hx.fillRect(0, chh * 0.2, cw, chh * 0.18);
    hx.font = `bold 30px ${FONT}`;
    hx.fillStyle = `rgba(220,200,170,${a})`;
    hx.fillText(c[0], cw / 2, chh * 0.23);
    hx.font = `15px ${FONT}`;
    hx.fillStyle = `rgba(150,140,150,${a})`;
    hx.fillText(c[1], cw / 2, chh * 0.23 + 46);
  }
  hx.textAlign = 'left';
}

// interactHint espelha a ordem de World.Interact: domar, colher, embarcar,
// jangada; sem nada por perto, lembra da tecla X para quem tem montaria.
function interactHint(me) {
  if (me.bt) return 'encoste na margem para descer do barco';
  const near = (x, y, r) => Math.hypot(x - me.x, y - me.y) <= r;
  for (const s of cur.steeds) {
    if (!near(s.x, s.y, 9)) continue;
    const k = info.steedk[s.k];
    return me.lv >= k.lv ? `[E] domar ${k.name} (+${k.speed} de velocidade)` : `${k.name}: precisa do nível ${k.lv}`;
  }
  for (const h of cur.herbs) if (near(h.x, h.y, 7)) return `[E] colher ${info.items[info.herbk[h.k]].name}`;
  for (const [dx, dy] of info.docks) if (near(dx, dy, 10)) return '[E] embarcar';
  const woodItem = info.items.findIndex(it => it.kind === 6), wood = (cur.inv.find(s => s[0] === woodItem) || [0, 0])[1];
  if (wood >= info.raft) {
    for (let dy = -6; dy <= 6; dy++) for (let dx = -6; dx <= 6; dx++) {
      const x = me.x + dx, y = me.y + dy;
      if (x >= 0 && y >= 0 && x < map.w && y < map.h && map.flags[y * map.w + x] & 4 && !(map.flags[y * map.w + x] & 8)) return `[E] montar jangada (${info.raft} madeiras)`;
    }
  }
  if (cur.owned && !me.mt) return '[X] montar';
  return '';
}

// Vida vermelha, mana azul, stamina verde.

function drawHUD(me) {

  hx.textBaseline = 'top';
  const ch = hx.measureText('M').width, lh = 17;
  const panel = (x, y, w, h, border) => {
    hx.fillStyle = '#000';
    hx.fillRect(x, y, w, h);
    hx.strokeStyle = border || '#cfcfcf';
    hx.lineWidth = 1;
    hx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  };
  const text = (s, x, y, color) => { hx.fillStyle = color || '#e6e6e6'; hx.fillText(s, x, y); };
  // Barra de tracinhos, como no HUD de referência.
  const stat = (x, y, label, v, max, full) => {
    text(label, x, y);
    const n = max > 0 && v > 0 ? clamp(Math.ceil(v * 14 / max), 0, 14) : 0;
    for (let i = 0; i < 14; i++) text('|', x + (3 + i) * ch, y, i < n ? full : '#2e2a2c');
    text(`${v}/${max}`, x + 18 * ch, y);
  };

  const pw = 32 * ch;
  panel(8, 8, pw, 6 * lh);
  text(`${me.name} · ${info.class}`, 8 + ch, 8 + lh * 0.5);
  stat(8 + ch, 8 + lh * 1.5, 'HP', me.hp, me.mhp, HP_C);
  stat(8 + ch, 8 + lh * 2.5, 'MP', me.mp, me.mmp, MP_C);
  stat(8 + ch, 8 + lh * 3.5, 'ST', cur.st, cur.mst, ST_C);
  text(`LV ${me.lv} · XP ${Math.floor(cur.xp * 100 / Math.max(1, cur.xpn))}% · ${me.g} ${info.cur}`, 8 + ch, 8 + lh * 4.5);

  let y = 8 + 6 * lh, shown = 0;

  // Status negativos ativos e a proteção das ervas, com o tempo que falta.
  const STC = ['#9aff6a', '#8ac8ff', '#ffb050'], CURE = ['antídoto', 'raiz-brasa', 'babosa'];
  const sts = [];
  cur.sts.forEach((s, i) => { if (s > 0) sts.push([`${info.status[i]} ${Math.ceil(s)}s — use ${CURE[i]}`, STC[i]]); });
  cur.imm.forEach((s, i) => { if (s > 0 && !cur.sts[i]) sts.push([`protegido (${CURE[i]}) ${s | 0}s`, '#8a8a96']); });
  if (sts.length) {
    panel(8, y, pw, (sts.length + 0.8) * lh);
    sts.forEach(([s, c], i) => text(s, 8 + ch, y + lh * (0.4 + i), c));
    y += (sts.length + 0.8) * lh;
  }
  // A borda da tela ganha a cor do mal que está agindo.
  const worst = cur.sts.findIndex(s => s > 0);
  if (worst >= 0) {
    const g = hx.createRadialGradient(cw / 2, chh / 2, Math.min(cw, chh) * 0.35, cw / 2, chh / 2, Math.max(cw, chh) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, ['rgba(90,200,40,.28)', 'rgba(90,150,255,.28)', 'rgba(255,140,40,.24)'][worst]);
    hx.fillStyle = g;
    hx.fillRect(0, 0, cw, chh);
  }

  // O que a tecla E faz aqui, escrito acima da cabeça.
  const hint = interactHint(me);
  if (hint && meScreen) {
    hx.font = `bold 13px ${FONT}`;
    hx.textAlign = 'center';
    const hxp = meScreen.x / dpr, hyp = meScreen.y / dpr - 64 - 4 * cs / dpr * (me.mt ? 2 : 1), tw = hx.measureText(hint).width;
    hx.fillStyle = 'rgba(0,0,0,.7)';
    hx.fillRect(hxp - tw / 2 - 6, hyp - 3, tw + 12, lh + 4);
    text(hint, hxp, hyp, '#ffe066');
    hx.font = `13px ${FONT}`;
    hx.textAlign = 'left';
  }

  for (const p of cur.players) {
    if (p === me || shown === 4) continue;
    panel(8, y, pw, 4 * lh);
    text(`${p.name} · ${p.lv}`, 8 + ch, y + lh * 0.5);
    stat(8 + ch, y + lh * 1.5, 'HP', p.hp, p.mhp, HP_C);
    stat(8 + ch, y + lh * 2.5, 'MP', p.mp, p.mmp, MP_C);
    y += 4 * lh; shown++;
  }
  if (shown) { panel(8, y, 9 * ch, 2 * lh); text('party', 8 + 2 * ch, y + lh * 0.5); }

  hx.textAlign = 'right';
  if (showFPS) text(`FPS ${fps}`, cw - 12, chh - 22, '#7dff7d');
  hx.textAlign = 'left';
  drawRight(me, cw, ch, lh, panel, text);
  if (openPanel === 'sheet') drawSheet(me, cw, chh, lh, panel, text);
  if (openPanel === 'shop') drawShop(me, cw, chh, panel, text);
  if (bigMap) {
    const src = mapSrc(me), k = Math.min((cw - 80) / src.w, (chh - 150) / src.h);
    const mw = src.w * k, mh = src.h * k, mx = (cw - mw) / 2, my = (chh - mh) / 2 + 10;
    panel(mx - 6, my - 28, mw + 12, mh + 34, '#ffe066');
    text('Mapa — as áreas escuras ainda não foram exploradas (M fecha)', mx, my - 22, '#ffe066');
    drawMap(me, mx, my, mw, mh, src, true);
  }

  // Barra de golpes: tecla, nome, custo e recarga; o terceiro fica trancado
  // até a primeira descida à cripta.
  const KEYS = ['Espaço', 'F', 'R'], sw = 27 * ch, sx0 = (cw - 3 * sw - 16) / 2, sy0 = chh - 30 - 2.4 * lh;
  info.skills.forEach((sk, i) => {
    const x = sx0 + i * (sw + 8), locked = i === 2 && !cur.unl, cd = cur.cds[i];
    const poor = me.mp < sk.cost;
    panel(x, sy0, sw, 2.4 * lh, locked ? '#55555f' : cd > 0 ? '#8a8a96' : '#cfcfcf');
    if (cd > 0 && !locked) {
      hx.fillStyle = 'rgba(120,130,170,.35)';
      hx.fillRect(x + 1, sy0 + 1, (sw - 2) * clamp(cd / sk.cd, 0, 1), 2.4 * lh - 2);
    }
    text(`[${KEYS[i]}] ${locked ? '???' : sk.name}`, x + ch, sy0 + lh * 0.3, locked ? '#6a6a76' : poor ? '#d06060' : '#e6e6e6');
    text(locked ? 'aprenda na cripta' : cd > 0 ? `${cd.toFixed(1)}s` : sk.cost ? `${sk.cost} MP` : 'pronto', x + ch, sy0 + lh * 1.25,
      locked ? '#6a6a76' : '#8a8a96');
  });

  const chatting = say.style.display === 'block';
  let cy = chh - (chatting ? 48 : 28) - cur.chat.length * lh;
  for (const l of cur.chat) {
    const who = l.from ? l.from : '*', body = l.from ? `: ${l.text}` : ` ${l.text}`;
    hx.fillStyle = 'rgba(0,0,0,.65)';
    hx.fillRect(8, cy - 2, hx.measureText(who + body).width + 2 * ch, lh);
    text(who, 8 + ch, cy, l.from ? css(playerColor(l.c)) : '#8a8a96');
    text(body, 8 + ch + hx.measureText(who).width, cy, l.from ? '#e6e6e6' : '#8a8a96');
    cy += lh;
  }
  if (!chatting) {
    const help = 'WASD: mover · Shift: correr · clique: golpe · direito: classe · E: interagir · X: montaria · Q: poção · Enter: falar · O: FPS';
    hx.fillStyle = 'rgba(0,0,0,.65)';
    hx.fillRect(8, chh - 24, hx.measureText(help).width + 2 * ch, lh);
    text(help, 8 + ch, chh - 22, '#8a8a96');
  }
  drawOverlays(cw, chh);
}

// ---------- início ----------

let cls = 0;
function pickClass(c) {
  cls = clamp(c | 0, 0, 6);
  for (const b of document.querySelectorAll('#classes button')) b.classList.toggle('on', +b.dataset.cls === cls);
}
for (const b of document.querySelectorAll('#classes button')) b.addEventListener('click', () => pickClass(+b.dataset.cls));

// Personagens deste navegador: carregar ou excluir (o excluir pede confirmação
// e o save vai para a lixeira do servidor, não some).
const CLASS_NAMES = ['Guerreiro', 'Mago', 'Cavaleiro', 'Paladino', 'Arqueiro', 'Ladino', 'Necromante'];
let delConfirm = '';
async function loadChars() {
  const box = $('chars');
  let list = [];
  try { list = await (await fetch('/chars?token=' + getToken())).json(); } catch (e) { box.textContent = 'Não consegui listar os personagens.'; return; }
  box.innerHTML = '';
  const title = document.createElement('p');
  title.style.color = '#ffe066';
  title.textContent = list.length ? 'Seus personagens' : 'Nenhum personagem neste navegador ainda.';
  box.appendChild(title);
  for (const c of list) {
    const row = document.createElement('div');
    row.className = 'row';
    const name = document.createElement('b'), info = document.createElement('span');
    name.textContent = c.name;
    info.textContent = `${CLASS_NAMES[c.cls] || '?'} · nível ${c.lv} · cap. ${Math.min(6, c.ch)}${c.on ? ' · conectado' : ''}`;
    const load = document.createElement('button'), del = document.createElement('button');
    load.type = del.type = 'button';
    load.className = 'load'; load.textContent = 'Carregar';
    del.className = 'del'; del.textContent = delConfirm === c.name ? 'Confirmar?' : 'Excluir';
    load.onclick = () => { $('pw').value = ''; pickClass(c.cls); join(c.name); };
    del.onclick = async () => {
      if (delConfirm !== c.name) { delConfirm = c.name; loadChars(); return; }
      delConfirm = '';
      const r = await (await fetch('/chars/delete', { method: 'POST', body: new URLSearchParams({ token: getToken(), name: c.name }) })).json();
      $('joinMsg').textContent = r.error ? 'Não consegui excluir: ' + r.error : c.name + ' foi para a lixeira do servidor.';
      loadChars();
    };
    row.append(name, info, load, del);
    box.appendChild(row);
  }
}

function join(name) {
  $('joinMsg').textContent = 'Conectando…';
  charName = name;
  try { localStorage.setItem('asciimmo.name', name); localStorage.setItem('asciimmo.cls', cls); } catch (e) { /* armazenamento bloqueado: segue sem lembrar */ }
  connect(name, cls);
}
$('joinForm').addEventListener('submit', e => {
  e.preventDefault();
  join($('name').value.trim() || 'anon');
});

try {
  initGL();
  resize();
  loadMap().catch(() => { $('joinMsg').textContent = 'Não consegui baixar o mapa do servidor.'; });
  requestAnimationFrame(frame);
  const q = new URLSearchParams(location.search), param = q.get('name');
  let saved = '', savedCls = 0;
  try { saved = localStorage.getItem('asciimmo.name') || ''; savedCls = +localStorage.getItem('asciimmo.cls') || 0; } catch (e) { /* idem */ }
  $('name').value = param || saved;
  pickClass(q.has('cls') ? +q.get('cls') : savedCls);
  // ?panel=inv|char|tree|ach e ?map abrem a tela já com o painel ou o mapa.
  openPanel = q.get('panel') || '';
  bigMap = q.has('map');
  loadChars();
  if (param) join(param); else $('name').focus();
} catch (err) {
  $('joinMsg').textContent = 'Erro ao iniciar: ' + err.message;
}
</script>
